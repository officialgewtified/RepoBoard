name: Update board data
on:
  schedule:
    # UTC times. Keep "schedule" in settings.json in sync with these.
    # 05:17 UTC is about 12:17am Eastern (1:17am during daylight time), so the day's picks are ready by morning.
    - cron: "17 5 * * 0,2,4,5,6"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [settings.json]   # changing the settings runs an update right away
permissions:
  contents: write
concurrency:
  group: board-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python update_data.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add data.json history.json brief.json
          if [ -f players.json ]; then git add players.json; fi
          git diff --staged --quiet && exit 0
          git commit -m "Update data"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push && exit 0; sleep 10; done
          exit 1
