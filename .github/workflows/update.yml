name: Update board data
on:
  schedule:
    # UTC times. Keep "schedule" in settings.json in sync with these.
    - cron: "0 14 * * 2,4,5,6"
    - cron: "0 15 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: board-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python update_data.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add data.json history.json
          git diff --staged --quiet && exit 0
          git commit -m "Update data"
          git pull --rebase origin ${{ github.ref_name }}
          git push
