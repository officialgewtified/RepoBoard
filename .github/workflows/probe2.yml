name: Probe 2 (temporary)
on:
  push:
    branches: [probe2]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/probe.sh > probe-out.txt 2>&1 || true
      - run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan out-br; git rm -rq --cached . ; git add probe-out.txt; if [ -d out ]; then git add out; fi
          git commit -qm "probe output"; git push -f origin out-br:probe2-out
