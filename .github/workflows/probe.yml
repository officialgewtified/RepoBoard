name: Probe ESPN access (temporary)
on:
  push:
    paths: [".github/workflows/probe.yml", ".github/probe.sh"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/probe.sh > probe-out.txt 2>&1 || true
      - run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan probe-out; git rm -rq --cached . ; git add probe-out.txt
          git commit -qm "probe output"; git push -f origin probe-out
