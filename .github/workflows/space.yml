name: Liftoff space report video
on:
  schedule:
    # 07:47 UTC is 3:47am Eastern (2:47 in winter): fresh asteroid, aurora, Sun and launch data, ready by about 5am
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Day of the report, YYYY-MM-DD (blank = today, Eastern time)"
        required: false
      dry:
        description: "Test only: pick the stories and titles, make no video, publish nothing"
        type: choice
        options: ["no", "yes"]
        default: "no"
permissions:
  contents: write
concurrency:
  group: space
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    defaults:
      run:
        working-directory: space
    steps:
      - uses: actions/checkout@v4
      - name: Which day
        run: |
          DAY="${{ inputs.day }}"
          [ -z "$DAY" ] && DAY=$(TZ=America/New_York date +%F)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sky data
        id: prep
        run: |
          mkdir -p out
          set +e
          node sky.js out/data.json "$DAY"
          code=$?
          if [ $code -eq 3 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ inputs.dry }}" = "yes" ] && [ $code -eq 0 ]; then
            { echo "## Test run for $DAY (nothing made or published)"; node -e "const d=require('./out/data.json');console.log('**Report:** '+d.ytTitle+'\n\nHook: '+d.voice.hook+'\n\nStories: '+d.scenes.map(s=>s.kind).join(', '))";
              for i in 1 2; do [ -f out/quick-$i.json ] && node -e "console.log('\n**Quick hit $i:** '+require('./out/quick-$i.json').ytTitle)"; done; } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - uses: actions/setup-python@v5
        if: steps.prep.outputs.skip != '1'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: steps.prep.outputs.skip != '1'
        with:
          path: |
            clips/.models
            ~/.cache/huggingface
          key: voices-kokoro-chatterbox-whisper-v2
      - name: Browser and ffmpeg
        if: steps.prep.outputs.skip != '1'
        timeout-minutes: 12
        # Playwright goes next to render.js (clips/), which is where it's loaded from
        working-directory: clips
        run: |
          npm i --no-save --no-package-lock playwright@1.63.0
          if which google-chrome; then echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"; else timeout 300 npx playwright install --with-deps chromium; fi
          if ! which ffmpeg; then timeout 120 sudo apt-get update -qq || true
            for i in 1 2 3; do timeout 150 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && break; echo "retry $i"; sudo pkill -9 -f apt-get || true; sleep 5; done; fi
          which ffmpeg
      - name: NASA footage
        if: steps.prep.outputs.skip != '1'
        continue-on-error: true
        # sharper footage takes longer to fetch (4K sources cut down to the vertical frame)
        timeout-minutes: 24
        run: for f in out/data.json out/quick-*.json; do node broll.js "$f"; done
      - name: Voiceover
        if: steps.prep.outputs.skip != '1'
        # Chatterbox reads it, cloned from a Kokoro af_bella read (Liftoff's own narrator); Kokoro reads it if that fails
        continue-on-error: true
        timeout-minutes: 100
        working-directory: clips
        run: |
          mkdir -p .models
          [ -f .models/kokoro-v1.0.int8.onnx ] || curl -sSfL -o .models/kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f .models/voices-v1.0.bin ] || curl -sSfL -o .models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          pip install -q kokoro-onnx soundfile faster-whisper
          python ref.py
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu && pip install -q chatterbox-tts || true
          for f in data quick-1 quick-2; do [ -f ../space/out/$f.json ] || continue
            python tts_cb.py ../space/out/$f.json ../space/out/voice-$f ref.wav || python tts.py ../space/out/$f.json ../space/out/voice-$f; done
        env:
          REF_VOICE: af_bella
          VOICE: af_bella
          SPEED: "1.1"
          EXAGGERATION: "0.65"
          CFG: "0.5"
          TEMPO: "1.06"
      - name: Render
        if: steps.prep.outputs.skip != '1'
        run: |
          node ../clips/render.js out/data.json "out/liftoff-$DAY.mp4" 30
          node -e "process.stdout.write(require('./out/data.json').caption)" > out/caption.txt
          for i in 1 2; do [ -f out/quick-$i.json ] || continue
            node ../clips/render.js out/quick-$i.json "out/liftoff-$DAY-quick-$i.mp4" 30 && node -e "process.stdout.write(require('./out/quick-$i.json').caption)" > out/caption-quick-$i.txt; done
          node -e "process.stdout.write((require('./out/data.json').facts||[]).join('\n'))" > out/fact-sheet.txt
      - name: Check before publishing
        # listens to the finished video: narration matches the script, nothing garbled, silent or clipped; a failure stops the publish
        if: steps.prep.outputs.skip != '1'
        run: |
          pip install -q faster-whisper
          # a quick hit that fails is dropped (the rest still go out); the full report failing stops everything
          for i in 1 2; do [ -f "out/liftoff-$DAY-quick-$i.mp4" ] || continue
            python ../clips/check.py "out/liftoff-$DAY-quick-$i.mp4" "out/quick-$i.json" || { echo "Dropping quick hit $i"; rm -f "out/liftoff-$DAY-quick-$i.mp4"; }; done
          python ../clips/check.py "out/liftoff-$DAY.mp4" out/data.json
      - name: Publish
        if: steps.prep.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the quick hits first, so the full report is the newest on the videos page
          for i in 2 1; do [ -f "out/liftoff-$DAY-quick-$i.mp4" ] || continue; T="space-$DAY-quick-$i"
            gh release delete "$T" --yes --cleanup-tag 2>/dev/null || true
            Q=$(ls out/liftoff-$DAY-quick-$i-thumbnail.jpg 2>/dev/null || true)
            gh release create "$T" "out/liftoff-$DAY-quick-$i.mp4" $Q out/fact-sheet.txt "out/quick-$i.json" --title "$(node -e "process.stdout.write(require('./out/quick-$i.json').ytTitle||'')")" --notes-file out/caption-quick-$i.txt --latest=false; done
          TAG="space-$DAY"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          THUMB=$(ls out/liftoff-$DAY-thumbnail.jpg 2>/dev/null || true)
          gh release create "$TAG" "out/liftoff-$DAY.mp4" $THUMB out/fact-sheet.txt out/data.json --title "$(node -e "process.stdout.write(require('./out/data.json').ytTitle||'')")" --notes-file out/caption.txt --latest=false
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep '^space-' | sort -r | tail -n +91 | xargs -r -I{} gh release delete {} --yes --cleanup-tag
