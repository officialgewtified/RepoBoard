name: Liftoff weekly long-form (This Week in Space)
on:
  schedule:
    # Sundays at 05:37 UTC (1:37am Eastern, 12:37 in winter): about 1.5 hours to make, ready well before 5am
    - cron: "37 5 * * 0"
  workflow_dispatch:
    inputs:
      day:
        description: "Episode date, YYYY-MM-DD (blank = today, Eastern time)"
        required: false
      dry:
        description: "Data only (publishes the narration and fact sheet as the draft-week release, no video)"
        required: false
        default: "no"
permissions:
  contents: write
concurrency:
  group: space-weekly
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: space
    steps:
      - uses: actions/checkout@v4
      - name: Which day
        run: |
          DAY="${{ inputs.day }}"
          [ -z "$DAY" ] && DAY=$(TZ=America/New_York date +%F)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: The week's data
        run: |
          npm i --no-save --no-package-lock astronomy-engine@2.1.19
          mkdir -p out
          node week.js out/data.json "$DAY" 2>&1 | tee out/narration.txt
      - name: Draft (data only)
        if: inputs.dry == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete draft-week --yes --cleanup-tag 2>/dev/null || true
          gh release create draft-week out/data.json out/fact-sheet.txt out/narration.txt --title "Draft: This Week in Space $DAY" --notes "Data-only check, not a video." --prerelease --latest=false
      - uses: actions/setup-python@v5
        if: inputs.dry != 'yes'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: inputs.dry != 'yes'
        with:
          path: |
            clips/.models
            ~/.cache/huggingface
          key: voices-kokoro-chatterbox-v1
      - name: Browser and ffmpeg
        if: inputs.dry != 'yes'
        timeout-minutes: 12
        working-directory: clips
        run: |
          npm i --no-save --no-package-lock playwright@1.63.0
          if which google-chrome; then echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"; else timeout 300 npx playwright install --with-deps chromium; fi
          if ! which ffmpeg; then timeout 120 sudo apt-get update -qq || true
            for i in 1 2 3; do timeout 150 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && break; echo "retry $i"; sudo pkill -9 -f apt-get || true; sleep 5; done; fi
          which ffmpeg
      - name: NASA footage (1080p or better)
        if: inputs.dry != 'yes'
        continue-on-error: true
        timeout-minutes: 30
        run: node broll.js out/data.json
      - name: Voiceover
        if: inputs.dry != 'yes'
        # about 8 minutes of narration: Chatterbox on a plain CPU takes a while, Kokoro reads it if that fails
        continue-on-error: true
        timeout-minutes: 200
        working-directory: clips
        run: |
          mkdir -p .models
          [ -f .models/kokoro-v1.0.int8.onnx ] || curl -sSfL -o .models/kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f .models/voices-v1.0.bin ] || curl -sSfL -o .models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          pip install -q kokoro-onnx soundfile
          python ref.py
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu && pip install -q chatterbox-tts || true
          python tts_cb.py ../space/out/data.json ../space/out/voice ref.wav || python tts.py ../space/out/data.json ../space/out/voice
        env:
          REF_VOICE: af_bella
          VOICE: af_bella
          SPEED: "1.1"
          EXAGGERATION: "0.65"
          CFG: "0.5"
          TEMPO: "1.06"
      - name: Render
        if: inputs.dry != 'yes'
        run: |
          node ../clips/render.js out/data.json "out/liftoff-week-$DAY.mp4" 24
          node -e "const d=require('./out/data.json'),fs=require('fs');const f='out/liftoff-week-$DAY.chapters.txt';const ch=fs.existsSync(f)?fs.readFileSync(f,'utf8').trim():'';process.stdout.write(d.description.replace('CHAPTERS_HERE',ch))" > out/description.txt
          cat out/description.txt
      - name: Publish
        if: inputs.dry != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="space-weekly-$DAY"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          TITLE=$(node -e "process.stdout.write(require('./out/data.json').ytTitle)")
          gh release create "$TAG" "out/liftoff-week-$DAY.mp4" "out/liftoff-week-$DAY-thumbnail.jpg" out/fact-sheet.txt out/data.json --title "$TITLE" --notes-file out/description.txt --latest=false
