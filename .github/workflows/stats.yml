name: Channel stats (YouTube)
on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node stats/fetch.js
      - name: Save
        run: |
          git config user.name "board-bot"; git config user.email "board-bot@users.noreply.github.com"
          git add stats/latest.json stats/history.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "Channel stats"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push && exit 0; sleep 10; done
