name: Daily stats video
on:
  schedule:
    # 07:13 UTC is about 3am Eastern: every game from the night before, West Coast included, is final by then.
    - cron: "13 7 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Game day to cover, YYYY-MM-DD (blank = yesterday, Eastern time)"
        required: false
permissions:
  contents: write
concurrency:
  group: clips
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: clips
    steps:
      - uses: actions/checkout@v4
      - name: Which day
        run: |
          DAY="${{ inputs.day }}"
          [ -z "$DAY" ] && DAY=$(TZ=America/New_York date -d yesterday +%F)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "Covering $DAY"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Box scores
        run: node fetch.js "$DAY" out
      - name: Season bests
        # fills in the season so far on its first run, then adds each day; without it the video just skips the "most this season" notes
        continue-on-error: true
        run: node records.js "$DAY" out
      - name: What to show and say
        id: prep
        run: |
          set +e
          node prep.js "$DAY" out/nfl.json out/nba.json out/cfb.json > out/data.json
          code=$?
          if [ $code -eq 3 ]; then echo "No finished games on $DAY, nothing to make."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - uses: actions/setup-python@v5
        if: steps.prep.outputs.skip != '1'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: steps.prep.outputs.skip != '1'
        with:
          path: |
            clips/.models
            ~/.u2net
            ~/.cache/huggingface
          key: voices-kokoro-chatterbox-v1
      - name: Python tools
        if: steps.prep.outputs.skip != '1'
        run: pip install -q kokoro-onnx soundfile "rembg[cpu]" pillow scipy "opencv-python-headless==4.10.0.84"
      - name: Player photos
        if: steps.prep.outputs.skip != '1'
        # free-to-use photos from Wikimedia Commons, cut out; players without one get their team badge
        continue-on-error: true
        # off: no player photos, just type, stats and team badges. Set PHOTOS to "on" to bring the cut-out photos back.
        env:
          PHOTOS: "off"
        run: if [ "$PHOTOS" = "on" ]; then python faces.py out/data.json; else echo "Player photos are off"; fi
      - name: Voiceover
        if: steps.prep.outputs.skip != '1'
        # Chatterbox reads it (natural, expressive); if that fails for any reason, Kokoro reads it so the day still gets a video
        continue-on-error: true
        timeout-minutes: 35
        run: |
          mkdir -p .models
          [ -f .models/kokoro-v1.0.int8.onnx ] || curl -sSfL -o .models/kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f .models/voices-v1.0.bin ] || curl -sSfL -o .models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          pip install -q kokoro-onnx soundfile
          python ref.py
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu && pip install -q chatterbox-tts || true
          python tts_cb.py out/data.json out/voice ref.wav || python tts.py out/data.json out/voice
        env:
          VOICE: am_puck
          SPEED: "1.05"
          EXAGGERATION: "0.5"
          CFG: "0.5"
      - name: Browser and ffmpeg
        if: steps.prep.outputs.skip != '1'
        # use the Chrome the runner already has (Playwright's own install was what kept hanging)
        timeout-minutes: 12
        run: |
          npm i --no-save --no-package-lock playwright@1.63.0
          if which google-chrome; then echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"; else timeout 300 npx playwright install --with-deps chromium; fi
          # ffmpeg from Ubuntu's own packages, with time limits and retries in case the mirror stalls
          if ! which ffmpeg; then timeout 120 sudo apt-get update -qq || true
            for i in 1 2 3; do timeout 150 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && break; echo "retry $i"; sudo pkill -9 -f apt-get || true; sleep 5; done; fi
          which ffmpeg
      - name: Render
        if: steps.prep.outputs.skip != '1'
        run: |
          PITCH=0.93 node render.js out/data.json "out/best-stats-$DAY.mp4" 30
          node -e "const d=require('./out/data.json');process.stdout.write(d.caption+(d.credits&&d.credits.length?'\n\nPhotos via Wikimedia Commons: '+d.credits.join('; '):''))" > out/caption.txt
      - name: Publish
        if: steps.prep.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="clip-$DAY"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "out/best-stats-$DAY.mp4" out/data.json --title "Best stats · $(date -d "$DAY" '+%a %b %-d')" --notes-file out/caption.txt --latest
          # keep the newest 30 videos
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep '^clip-' | sort -r | tail -n +31 | xargs -r -I{} gh release delete {} --yes --cleanup-tag
      - name: Save season bests and photos
        if: always()
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          [ -f records.json ] && git add records.json
          [ -d faces ] && git add faces
          git diff --staged --quiet && exit 0
          git commit -m "Season bests and player photos through $DAY"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push && exit 0; sleep 10; done
          exit 1
