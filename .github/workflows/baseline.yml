name: Update Baseline (basketball)
on:
  schedule:
    # 05:37 UTC is about 12:37am Eastern (1:37am during daylight time), so the day's picks are ready by morning.
    # Keep "schedule" in baseline/settings.json in sync.
    - cron: "37 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [baseline/settings.json]   # changing the settings runs an update right away
permissions:
  contents: write
concurrency:
  group: baseline-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python baseline/update_data.py
        env:
          # Its own Odds API key (a second free account), so basketball has its own credits
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY_BASELINE }}
      - run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add baseline/data.json baseline/history.json baseline/brief.json
          if [ -f baseline/players.json ]; then git add baseline/players.json; fi
          git diff --staged --quiet && exit 0
          git commit -m "Update Baseline data"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push && exit 0; sleep 10; done
          exit 1
