name: Tonight's games preview video
on:
  schedule:
    # 19:23 UTC is about 3:23pm Eastern (2:23pm in winter): the slate, injuries and recent form are set, and it's ready well before tip-off.
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Day to preview, YYYY-MM-DD (blank = today, Eastern time)"
        required: false
permissions:
  contents: write
concurrency:
  group: preview
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: clips
    steps:
      - uses: actions/checkout@v4
      - name: Which day
        run: |
          DAY="${{ inputs.day }}"
          [ -z "$DAY" ] && DAY=$(TZ=America/New_York date +%F)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tonight's slate
        id: prep
        run: |
          mkdir -p out
          set +e
          node preview.js "$DAY" out/data.json
          code=$?
          if [ $code -eq 3 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - uses: actions/setup-python@v5
        if: steps.prep.outputs.skip != '1'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: steps.prep.outputs.skip != '1'
        with:
          path: |
            clips/.models
            ~/.u2net
            ~/.cache/huggingface
          key: voices-kokoro-chatterbox-v1
      - name: Voiceover
        if: steps.prep.outputs.skip != '1'
        # Chatterbox reads it (natural, expressive); if that fails for any reason, Kokoro reads it so the day still gets a video
        continue-on-error: true
        timeout-minutes: 35
        run: |
          mkdir -p .models
          [ -f .models/kokoro-v1.0.int8.onnx ] || curl -sSfL -o .models/kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f .models/voices-v1.0.bin ] || curl -sSfL -o .models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          pip install -q kokoro-onnx soundfile
          python ref.py
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu && pip install -q chatterbox-tts || true
          python tts_cb.py out/data.json out/voice ref.wav || python tts.py out/data.json out/voice
        env:
          VOICE: am_puck
          SPEED: "1.05"
          EXAGGERATION: "0.5"
          CFG: "0.5"
      - name: Browser and ffmpeg
        if: steps.prep.outputs.skip != '1'
        # use the Chrome the runner already has (Playwright's own install was what kept hanging)
        timeout-minutes: 12
        run: |
          npm i --no-save --no-package-lock playwright@1.63.0
          if which google-chrome; then echo "PW_CHANNEL=chrome" >> "$GITHUB_ENV"; else timeout 300 npx playwright install --with-deps chromium; fi
          # ffmpeg from Ubuntu's own packages, with time limits and retries in case the mirror stalls
          if ! which ffmpeg; then timeout 120 sudo apt-get update -qq || true
            for i in 1 2 3; do timeout 150 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && break; echo "retry $i"; sudo pkill -9 -f apt-get || true; sleep 5; done; fi
          which ffmpeg
      - name: Render
        if: steps.prep.outputs.skip != '1'
        run: |
          PITCH=0.93 node render.js out/data.json "out/tonight-$DAY.mp4" 30
          node -e "process.stdout.write(require('./out/data.json').caption)" > out/caption.txt
      - name: Publish
        if: steps.prep.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-$DAY"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "out/tonight-$DAY.mp4" out/data.json --title "Tonight · $(date -d "$DAY" '+%a %b %-d')" --notes-file out/caption.txt --latest=false
          # keep the newest 30 previews
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep '^preview-' | sort -r | tail -n +31 | xargs -r -I{} gh release delete {} --yes --cleanup-tag
