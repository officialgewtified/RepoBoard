name: Scout comparison photos (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "rembg[cpu]" pillow
      - run: python tools/scout_refs.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete scout-refs --yes --cleanup-tag 2>/dev/null || true
          gh release create scout-refs out/refs/* --title "Scout: comparison photos" --notes "Candidates for the Liftoff size comparison" --prerelease --latest=false
