<!doctype html>
<html><head><meta charset="utf-8"><title>Liftoff space report</title>
<style>
@font-face{font-family:"Unbounded";src:url(../fonts/unbounded-var.woff2) format("woff2");font-weight:200 900}
@font-face{font-family:"JBM";src:url(../fonts/jetbrains-mono-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"JBM";src:url(../fonts/jetbrains-mono-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:"JBM";src:url(../fonts/jetbrains-mono-800.woff2) format("woff2");font-weight:800}
@font-face{font-family:"Archivo";src:url(../fonts/archivo-x.woff) format("woff");font-weight:400 900;font-stretch:62% 125%}
/* Liftoff. Mission-control look: deep space black, ion cyan, solar amber, aurora green. Transparent page: NASA footage plays underneath. */
:root{--void:#03040A;--ink:#EAF2FF;--dim:#8A97B2;--ion:#4FF3FF;--sol:#FFB547;--aur:#5CFFA8;--mag:#FF4FD8;--red:#FF5A5A;--glass:rgba(4,8,20,.66);--line:rgba(79,243,255,.32)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{font-family:"Archivo",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"JBM",monospace}
#stars{position:absolute;inset:0}
#vt{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(3,4,10,.92) 0%,rgba(3,4,10,.55) 14%,rgba(3,4,10,0) 26%,rgba(3,4,10,0) 52%,rgba(3,4,10,.72) 70%,rgba(3,4,10,.94) 100%)}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
.br{position:absolute;width:60px;height:60px;border:3px solid var(--ion);opacity:.75}
.br.a{left:34px;top:34px;border-right:0;border-bottom:0}.br.b{right:34px;top:34px;border-left:0;border-bottom:0}
.br.c{left:34px;bottom:34px;border-right:0;border-top:0}.br.d{right:34px;bottom:34px;border-left:0;border-top:0}
#hud{position:absolute;left:70px;right:70px;top:84px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:18px;font:800 46px/1 "Unbounded";letter-spacing:.06em}
.brand svg{width:64px;height:64px}
.hr{font:700 26px/1 "JBM";letter-spacing:.14em;color:var(--ion);text-align:right}
.hr small{display:block;margin-top:10px;color:var(--dim);font-weight:400;font-size:22px}
.live{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red);margin-right:10px;vertical-align:2px;box-shadow:0 0 12px var(--red)}
#tick{position:absolute;left:70px;right:70px;top:186px;height:14px;background:repeating-linear-gradient(90deg,rgba(79,243,255,.5) 0 2px,transparent 2px 24px);opacity:.5;-webkit-mask-image:linear-gradient(90deg,#000,transparent)}
#prog{position:absolute;left:70px;top:206px;height:4px;width:0;background:var(--ion);box-shadow:0 0 14px var(--ion)}
.sc{position:absolute;left:64px;right:120px;top:240px;bottom:330px;opacity:0;will-change:transform}
.kick{display:inline-flex;align-items:center;gap:14px;padding:14px 22px;border:2px solid var(--ion);color:var(--ion);font:800 28px/1 "JBM";letter-spacing:.14em;text-transform:uppercase;background:rgba(4,8,20,.6)}
.kick i{width:12px;height:12px;background:var(--ion);box-shadow:0 0 14px var(--ion)}
.t1{font:800 84px/1 "Unbounded";letter-spacing:.01em;text-transform:uppercase;margin-top:22px;white-space:nowrap;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.meta{font:700 28px/1.3 "JBM";letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-top:16px}
.panel{position:relative;background:var(--glass);border:2px solid var(--line);padding:26px 30px;margin-top:26px}
.panel::before,.panel::after{content:"";position:absolute;width:22px;height:22px;border:3px solid var(--ion)}
.panel::before{left:-3px;top:-3px;border-right:0;border-bottom:0}.panel::after{right:-3px;bottom:-3px;border-left:0;border-top:0}
.plab{font:800 22px/1 "JBM";letter-spacing:.18em;color:var(--ion);text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.tile{background:var(--glass);border:2px solid var(--line);padding:20px 20px 18px;min-width:0}
.tile b{display:block;font:800 60px/1 "Unbounded";white-space:nowrap}
.tile span{display:block;margin-top:12px;font:700 20px/1.2 "JBM";letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.svg{display:block;width:100%}
/* hook */
#hook .ret{position:absolute;left:50%;top:330px;width:620px;height:620px;margin:-310px 0 0 -310px}
#hook .low{position:absolute;left:0;right:0;bottom:0}
#hook .big{font:900 230px/.9 "Unbounded";letter-spacing:-.03em;white-space:nowrap;margin-top:26px;text-shadow:0 0 50px rgba(79,243,255,.55),0 10px 0 rgba(0,0,0,.35)}
#hook .unit{font:700 52px/1.05 "Unbounded";text-transform:uppercase;margin-top:12px;color:var(--ion)}
#hook .sub{font:700 30px/1.2 "JBM";letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-top:20px}
/* aurora */
.scope{position:relative;width:520px;height:520px;margin:30px auto 0}
.scope .img{position:absolute;inset:30px;border-radius:50%;overflow:hidden;background:#000}
.scope img{width:100%;height:100%;object-fit:cover;transform:scale(1.32);filter:saturate(1.3) contrast(1.1)}
.scope svg{position:absolute;inset:0;width:100%;height:100%}
.aurrow{display:grid;grid-template-columns:330px 1fr;gap:26px;align-items:center}
.where{font:700 30px/1.25 "Unbounded";text-transform:none}
/* sun */
.sunbox{position:relative;width:560px;height:560px;margin:24px auto 0}
.sunbox img{position:absolute;inset:40px;width:480px;height:480px;border-radius:50%;object-fit:cover}
.sunbox .glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,181,71,.55) 35%,rgba(255,120,30,.18) 55%,transparent 70%)}
/* launches */
.lc{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center;background:var(--glass);border:2px solid var(--line);padding:22px 26px;margin-top:18px;position:relative}
.lc .d{text-align:center;border-right:2px solid var(--line);padding-right:20px}
.lc .d b{display:block;font:800 52px/1 "Unbounded";color:var(--sol)}
.lc .d span{display:block;margin-top:8px;font:700 22px/1 "JBM";color:var(--dim)}
.lc .r b{display:block;font:800 40px/1.05 "Unbounded";white-space:nowrap;overflow:hidden}
.lc .r p{margin-top:8px;font:600 28px/1.2 "Archivo";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .r small{display:block;margin-top:10px;font:700 21px/1.2 "JBM";letter-spacing:.06em;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .tm{position:absolute;right:20px;top:18px;font:800 22px/1 "JBM";color:var(--ion);letter-spacing:.06em}
/* moon */
.moonrow{display:grid;grid-template-columns:520px 1fr;gap:20px;align-items:center;margin-top:20px}
.moonrow .pct b{display:block;font:900 150px/.9 "Unbounded"}
.moonrow .pct span{display:block;font:700 30px/1.2 "JBM";letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-top:12px}
.phases{display:flex;justify-content:space-between;margin-top:24px}
.phases div{text-align:center;font:700 16px/1 "JBM";color:var(--dim)}
.phases div.on{color:var(--ion)}
/* outro + logo */
#outro .mid{position:absolute;left:0;right:0;top:300px;text-align:center}
#outro .t1{font-size:96px;white-space:normal;line-height:1.05}
.follow{display:inline-flex;align-items:center;justify-content:center;margin-top:46px;min-width:560px;height:118px;border:3px solid var(--ion);font:800 40px/1 "Unbounded";letter-spacing:.06em;color:var(--ion);position:relative}
.ring{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;border:4px solid var(--ion);opacity:0}
#logo{position:absolute;left:50%;top:45%;width:560px;height:560px;margin:-280px 0 0 -280px;opacity:0;z-index:9;overflow:visible}
#wordm{position:absolute;left:0;right:0;top:calc(45% + 300px);text-align:center;opacity:0;z-index:9;font:900 110px/1 "Unbounded";letter-spacing:.12em}
#wordm small{display:block;margin-top:22px;font:700 30px/1 "JBM";letter-spacing:.3em;color:var(--ion)}
#black{position:absolute;inset:0;background:var(--void);opacity:0;z-index:8}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:10;pointer-events:none}
#src{position:absolute;left:70px;right:140px;bottom:120px;font:400 20px/1.3 "JBM";color:rgba(234,242,255,.45);letter-spacing:.04em}
/* cover image */
#thumb{position:absolute;inset:0;display:none;z-index:30;overflow:hidden;background:radial-gradient(70% 45% at 50% 34%,#0f2a4a 0%,#060a18 55%,#020309 100%)}
#thumb .neb{position:absolute;inset:0;background:radial-gradient(40% 30% at 25% 20%,rgba(255,79,216,.25),transparent 70%),radial-gradient(45% 35% at 80% 60%,rgba(79,243,255,.18),transparent 70%)}
#thumb .art{position:absolute;left:90px;right:90px;top:210px;height:820px;display:flex;align-items:center;justify-content:center}
#thumb .art img{width:760px;height:760px;border-radius:50%;object-fit:cover;box-shadow:0 0 140px rgba(255,181,71,.6)}
#thumb .k{position:absolute;left:0;right:0;top:1000px;text-align:center}
#thumb .k span{display:inline-block;background:#FFD60A;color:#05060c;font:900 64px/1 "Unbounded";padding:20px 34px;transform:rotate(-2deg);text-transform:uppercase;box-shadow:0 20px 40px rgba(0,0,0,.6);white-space:nowrap}
#thumb .bigt{position:absolute;left:30px;right:30px;top:1140px;text-align:center;font:900 190px/.92 "Unbounded";letter-spacing:-.03em;text-shadow:0 0 60px rgba(79,243,255,.6),0 12px 0 rgba(0,0,0,.4);white-space:nowrap}
#thumb .u{position:absolute;left:0;right:0;top:1340px;text-align:center;font:800 58px/1.1 "Unbounded";color:var(--ion);text-transform:uppercase}
#thumb .bn{position:absolute;left:-20px;right:-20px;bottom:150px;background:#fff;color:#05060c;text-align:center;padding:26px 0;font:900 64px/1 "Unbounded";letter-spacing:.04em;transform:rotate(-2deg);text-transform:uppercase}
#thumb .tl{position:absolute;left:70px;top:80px;font:900 60px/1 "Unbounded";letter-spacing:.08em;display:flex;align-items:center;gap:18px}
#thumb .tl svg{width:70px;height:70px}
</style></head><body>
<svg id="stars"></svg>
<div id="vt"></div><div id="scan"></div>
<div class="br a"></div><div class="br b"></div><div class="br c"></div><div class="br d"></div>
<div id="hud"><div class="brand"><svg viewBox="0 0 100 100" id="mk"></svg><span id="bn"></span></div><div class="hr"><span class="live"></span><span id="hd"></span><small id="hs"></small></div></div>
<div id="tick"></div><div id="prog"></div>
<div id="stage"></div>
<div id="src"></div>
<div id="black"></div>
<svg id="logo" viewBox="0 0 200 200"></svg>
<div id="wordm"><span id="wm"></span><small>Space news · every day</small></div>
<div id="flash"></div>
<div id="thumb"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>1-Math.pow(1-clamp(x),3),eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pop=x=>{x=clamp(x);if(x>=1)return 1;const c=1.70158*1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let D=null,SC=[],TOTAL=30,SFX=[],STARS=[];const INTRO=2.3,TAIL=2.4,MIN=61.5;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const com=x=>Math.round(+x).toLocaleString("en-US");
function rnd(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function fit(el,min){let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&fs>min){fs-=3;el.style.fontSize=fs+"px"}}
// the Liftoff mark: a rocket rising through a ring, a tilted orbit with a moon on it
const MARK=(id="")=>`<defs><linearGradient id="${id}fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7A3"/><stop offset=".45" stop-color="#FFB547"/><stop offset="1" stop-color="#FF4F2E" stop-opacity="0"/></linearGradient>
 <linearGradient id="${id}bd" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9c6e0"/></linearGradient>
 <linearGradient id="${id}tr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7A3" stop-opacity=".95"/><stop offset=".25" stop-color="#FFB547" stop-opacity=".6"/><stop offset="1" stop-color="#FF4F2E" stop-opacity="0"/></linearGradient></defs>
 <circle cx="100" cy="100" r="74" fill="none" stroke="#EAF2FF" stroke-width="9"/><ellipse id="${id}orb" cx="100" cy="100" rx="96" ry="34" fill="none" stroke="#4FF3FF" stroke-width="4" transform="rotate(-24 100 100)" stroke-dasharray="604" stroke-dashoffset="0"/>
 <g id="${id}rkt"><rect id="${id}trail" x="91" y="150" width="18" height="420" rx="9" fill="url(#${id}tr)" opacity="0"/><path class="fl" d="M88 138 C89 158 95 176 100 194 C105 176 111 158 112 138Z" fill="url(#${id}fl)"/><path d="M93 138 C94 150 97 160 100 170 C103 160 106 150 107 138Z" fill="#FFF6D6"/>
 <path d="M79 106 L60 132 L60 148 L80 138Z M121 106 L140 132 L140 148 L120 138Z" fill="#4FF3FF"/><path d="M100 30 C117 46 122 68 122 94 L122 136 L78 136 L78 94 C78 68 83 46 100 30Z" fill="url(#${id}bd)"/>
 <rect x="86" y="134" width="28" height="8" rx="2" fill="#5b6785"/><circle cx="100" cy="82" r="10" fill="#03040A" stroke="#4FF3FF" stroke-width="4"/></g>
 <circle id="${id}moon" r="10" fill="#4FF3FF" style="filter:drop-shadow(0 0 8px #4FF3FF)"/>`;
const orbPos=(a)=>{const x=96*Math.cos(a),y=34*Math.sin(a),r=-24*Math.PI/180;return[100+x*Math.cos(r)-y*Math.sin(r),100+x*Math.sin(r)+y*Math.cos(r)]};
// ---- graphics
function rock(seed,r){const R=rnd(seed),n=18;let p="";for(let i=0;i<n;i++){const a=i/n*2*Math.PI,k=r*(.82+.3*R());p+=(i?"L":"M")+(k*Math.cos(a)).toFixed(1)+" "+(k*Math.sin(a)*.86).toFixed(1)}
 let cr="";for(let i=0;i<5;i++){const a=R()*6.28,d=R()*r*.55,cr2=r*(.08+.12*R());cr+=`<circle cx="${(d*Math.cos(a)).toFixed(1)}" cy="${(d*Math.sin(a)).toFixed(1)}" r="${cr2.toFixed(1)}" fill="rgba(0,0,0,.28)"/>`}
 return `<path d="${p}Z" fill="url(#rk)"/>${cr}`}
// silhouettes, drawn in metres (width x height) so they sit at true scale next to the asteroid
const SIL={car:[4.5,1.5,w=>`<path d="M0 -0.35 L0.3 -0.35 L1 -0.75 L2.9 -0.8 L3.6 -0.35 L4.5 -0.3 L4.5 -0.05 L0 -0.05Z M0.7 0 a0.35 0.35 0 1 0 0.01 0 M3.5 0 a0.35 0.35 0 1 0 0.01 0" transform="scale(1 1.8)"/>`],
 bus:[12,3.2,()=>`<rect x="0" y="-3.2" width="12" height="2.8" rx="0.3"/><circle cx="2.3" cy="-0.4" r="0.55"/><circle cx="9.6" cy="-0.4" r="0.55"/>`],
 whale:[30,5,()=>`<path d="M0 -2.2 C3 -5 14 -5.2 22 -3 L27 -4.8 L30 -5 L27.5 -2.5 L30 -0.2 L27 -0.6 L22 -1.6 C14 0.2 4 0.3 0 -2.2Z"/>`],
 plane:[70,19,()=>`<path d="M0 -6 C2 -9 6 -10 12 -10 L58 -10 L66 -19 L70 -19 L68 -9 L70 -6 L64 -5 L12 -5 C5 -5 1 -5 0 -6Z M28 -7 L44 -2 L48 -2 L40 -8Z"/>`],
 field:[110,6,()=>`<rect x="0" y="-3" width="110" height="3"/><rect x="0" y="-3" width="10" height="3" opacity=".6"/><rect x="100" y="-3" width="10" height="3" opacity=".6"/>`],
 tower:[125,330,()=>`<path d="M0 0 C30 -30 50 -110 58 -280 L60 -330 L65 -330 L67 -280 C75 -110 95 -30 125 0 L95 0 C80 -40 45 -40 30 0Z"/>`],
 tower2:[57,443,()=>`<path d="M0 0 L0 -60 L6 -60 L6 -200 L12 -200 L12 -330 L20 -330 L20 -380 L26 -380 L28 -443 L29 -443 L31 -380 L37 -380 L37 -330 L45 -330 L45 -200 L51 -200 L51 -60 L57 -60 L57 0Z"/>`]};
function sizeSvg(s){const ref=s.ref,S0=SIL[ref.icon]||SIL.bus,[rw,rh]=S0,d=s.ft/3.281,W=920,H=330,base=290;
 const sc=Math.min(260/Math.max(rh,d),(W-260)/(rw+d*1.1));const ax=60+d*sc/2,rx=ax+d*sc/2+60;
 return `<svg class="svg" viewBox="0 0 ${W} ${H}"><defs><radialGradient id="rk" cx="35%" cy="30%"><stop offset="0" stop-color="#b9b2a8"/><stop offset=".6" stop-color="#6d655d"/><stop offset="1" stop-color="#2a2622"/></radialGradient></defs>
  <line x1="20" y1="${base}" x2="${W-20}" y2="${base}" stroke="rgba(234,242,255,.4)" stroke-width="2" stroke-dasharray="6 8"/>
  <g class="az" data-t="translate(${ax} ${base-d*sc/2})" transform="translate(${ax} ${base-d*sc/2})">${rock(7,d*sc/2)}</g>
  <g class="rf" transform="translate(${rx} ${base}) scale(${sc})" fill="rgba(234,242,255,.85)">${S0[2]()}</g>
  <text x="${ax}" y="${base+32}" text-anchor="middle" font-family="JBM" font-weight="800" font-size="24" fill="#4FF3FF">≈ ${com(s.ft)} FT</text>
  <text x="${rx+rw*sc/2}" y="${base+32}" text-anchor="middle" font-family="JBM" font-weight="700" font-size="22" fill="#8A97B2">${esc(ref.name.replace(/^(a|the) /,"").toUpperCase())} · ${com(ref.m*3.281)} FT</text></svg>`}
function distSvg(s){const W=920,H=250,y=120,x0=80,x1=W-60,max=s.ld<=1.15?1.3:s.ld*1.18,X=v=>x0+(x1-x0)*v/max,mx=X(1),ax=X(s.ld);
 return `<svg class="svg" viewBox="0 0 ${W} ${H}"><defs><radialGradient id="eg" cx="35%" cy="30%"><stop offset="0" stop-color="#8fd3ff"/><stop offset=".55" stop-color="#1f6fd1"/><stop offset="1" stop-color="#0a2550"/></radialGradient></defs>
  <line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="rgba(234,242,255,.35)" stroke-width="2" stroke-dasharray="4 10"/>
  <circle cx="${x0}" cy="${y}" r="48" fill="url(#eg)"/><circle cx="${mx}" cy="${y}" r="17" fill="#c9c6bf"/>
  <text x="${x0}" y="${y+86}" text-anchor="middle" font-family="JBM" font-weight="800" font-size="22" fill="#8A97B2">EARTH</text>
  <text x="${mx}" y="${y+86}" text-anchor="middle" font-family="JBM" font-weight="800" font-size="22" fill="#8A97B2">MOON</text>
  <text x="${mx}" y="${y+112}" text-anchor="middle" font-family="JBM" font-size="19" fill="#8A97B2">238,900 MI</text>
  <path class="tr" d="M${x1} ${y-70} Q ${(ax+x1)/2} ${y-60} ${ax} ${y}" fill="none" stroke="#FFB547" stroke-width="3" stroke-dasharray="8 8"/>
  <g class="am" data-x0="${x1}" data-x="${ax}" data-y="${y}"><circle r="12" fill="#FFB547" style="filter:drop-shadow(0 0 10px #FFB547)"/><circle r="26" fill="none" stroke="#FFB547" stroke-width="2"/></g>
  <text class="al" x="${ax}" y="${y-44}" text-anchor="middle" font-family="JBM" font-weight="800" font-size="26" fill="#FFB547">${com(s.miles)} MI</text></svg>`}
function kpSvg(kp){const cx=160,cy=170,r=130,arc=(a,b,c)=>{const p=t=>[cx-r*Math.cos(Math.PI*t/9),cy-r*Math.sin(Math.PI*t/9)],[x0,y0]=p(a),[x1,y1]=p(b);return `<path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}" stroke="${c}" stroke-width="22" fill="none"/>`};
 return `<svg class="svg" viewBox="0 0 320 210">${arc(0,4,"#2f6f5a")}${arc(4,5,"#5CFFA8")}${arc(5,7,"#FFB547")}${arc(7,9,"#FF5A5A")}
  ${[0,3,5,7,9].map(v=>{const a=Math.PI*v/9;return `<text x="${cx-(r+30)*Math.cos(a)}" y="${cy-(r+30)*Math.sin(a)+7}" text-anchor="middle" font-family="JBM" font-weight="700" font-size="16" fill="#8A97B2">${v}</text>`}).join("")}
  <g class="ndl" data-kp="${kp}"><line x1="${cx}" y1="${cy}" x2="${cx-r+18}" y2="${cy}" stroke="#EAF2FF" stroke-width="6" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="12" fill="#EAF2FF"/></g>
  <text x="${cx}" y="${cy+36}" text-anchor="middle" font-family="Unbounded" font-weight="800" font-size="30" fill="#EAF2FF">KP <tspan class="kpn" data-v="${kp}">${kp}</tspan></text></svg>`}
function flareSvg(s){const W=880,x=c=>{const m=String(c||"").match(/^([ABCMX])([\d.]+)/);if(!m)return null;const i="ABCMX".indexOf(m[1]);return 20+(W-40)*(i+Math.log10(Math.max(1,parseFloat(m[2]))))/5};
