<!doctype html>
<html><head><meta charset="utf-8"><title>Liftoff higher or lower</title>
<style>
@font-face{font-family:"Unbounded";src:url(../fonts/unbounded-var.woff2) format("woff2");font-weight:200 900}
@font-face{font-family:"JBM";src:url(../fonts/jetbrains-mono-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"JBM";src:url(../fonts/jetbrains-mono-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:"JBM";src:url(../fonts/jetbrains-mono-800.woff2) format("woff2");font-weight:800}
@font-face{font-family:"Bebas";src:url(../fonts/bebas-neue.woff) format("woff")}
@font-face{font-family:"Archivo";src:url(../fonts/archivo-x.woff) format("woff");font-weight:400 900;font-stretch:62% 125%}
/* Liftoff. Mission-control look: deep space black, ion cyan, solar amber, aurora green. Transparent page: NASA footage plays underneath. */
:root{--void:#03040A;--ink:#EAF2FF;--dim:#A9B6CF;--ion:#4FF3FF;--sol:#FFB547;--aur:#5CFFA8;--mag:#FF4FD8;--red:#FF5A5A;--glass:rgba(4,8,20,.66);--line:rgba(79,243,255,.32)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{font-family:"Archivo",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:"JBM",monospace}
#stars{position:absolute;inset:0}
#vt{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(3,4,10,.92) 0%,rgba(3,4,10,.55) 14%,rgba(3,4,10,0) 26%,rgba(3,4,10,0) 52%,rgba(3,4,10,.72) 70%,rgba(3,4,10,.94) 100%)}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
.br{position:absolute;width:60px;height:60px;border:3px solid var(--ion);opacity:.75}
.br.a{left:34px;top:34px;border-right:0;border-bottom:0}.br.b{right:34px;top:34px;border-left:0;border-bottom:0}
.br.c{left:34px;bottom:34px;border-right:0;border-top:0}.br.d{right:34px;bottom:34px;border-left:0;border-top:0}
#hud{position:absolute;left:70px;right:70px;top:84px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:18px;font:800 46px/1 "Unbounded";letter-spacing:.06em}
.brand svg{width:64px;height:64px}
.hr{font:700 26px/1 "JBM";letter-spacing:.14em;color:var(--ion);text-align:right}
.hr small{display:block;margin-top:10px;color:var(--dim);font-weight:400;font-size:22px}
.live{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red);margin-right:10px;vertical-align:2px;box-shadow:0 0 12px var(--red)}
#tick{position:absolute;left:70px;right:70px;top:186px;height:14px;background:repeating-linear-gradient(90deg,rgba(79,243,255,.5) 0 2px,transparent 2px 24px);opacity:.5;-webkit-mask-image:linear-gradient(90deg,#000,transparent)}
#prog{position:absolute;left:70px;top:206px;height:4px;width:0;background:var(--ion);box-shadow:0 0 14px var(--ion)}
.sc{position:absolute;left:64px;right:120px;top:240px;bottom:330px;opacity:0;will-change:transform}
/* a dark scrim behind the data screens so text stays readable over bright footage (the hook keeps the footage vivid) */
.sc:not(#hook)::before{content:"";position:absolute;left:-64px;right:-120px;top:-60px;bottom:-60px;z-index:-1;
 background:linear-gradient(180deg,rgba(3,4,10,.62) 0%,rgba(3,4,10,.42) 45%,rgba(3,4,10,.62) 100%)}
.kick{display:inline-flex;align-items:center;gap:14px;padding:14px 22px;border:2px solid var(--ion);color:var(--ion);font:800 28px/1 "JBM";letter-spacing:.14em;text-transform:uppercase;background:rgba(4,8,20,.6)}
.kick i{width:12px;height:12px;background:var(--ion);box-shadow:0 0 14px var(--ion)}
.t1{font:800 84px/1 "Unbounded";letter-spacing:.01em;text-transform:uppercase;margin-top:22px;white-space:nowrap;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.meta{font:700 28px/1.3 "JBM";letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-top:16px}
/* typed lines: a data readout under the title and a "did you know" at the bottom */
.rd{font:700 22px/1.3 "JBM";letter-spacing:.06em;color:var(--aur);margin-top:12px;white-space:nowrap;overflow:hidden;min-height:29px}
.ty{position:absolute;left:0;right:0;bottom:0;font:700 27px/1.38 "JBM";color:var(--ink);background:rgba(4,8,20,.72);border-left:5px solid var(--ion);padding:16px 20px}
/* the full line sits invisibly underneath so the box is its final size from the first frame (no jumping while it types) */
.ty .gh{visibility:hidden}.ty .tp{position:absolute;left:20px;right:20px;top:16px}
.ty .cr{display:inline-block;width:14px;height:26px;background:var(--ion);vertical-align:-4px;margin-right:-14px}
.ty b{color:var(--ion);font-weight:800}
.cr{display:inline-block;width:14px;height:26px;background:var(--ion);vertical-align:-4px;margin-left:4px}
.panel{position:relative;background:var(--glass);border:2px solid var(--line);padding:26px 30px;margin-top:26px}
.panel::before,.panel::after{content:"";position:absolute;width:22px;height:22px;border:3px solid var(--ion)}
.panel::before{left:-3px;top:-3px;border-right:0;border-bottom:0}.panel::after{right:-3px;bottom:-3px;border-left:0;border-top:0}
.plab{font:800 22px/1 "JBM";letter-spacing:.18em;color:var(--ion);text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.tile{background:var(--glass);border:2px solid var(--line);padding:20px 20px 18px;min-width:0}
.tile b{display:block;font:800 60px/1 "Unbounded";white-space:nowrap}
.tile span{display:block;margin-top:12px;font:700 20px/1.2 "JBM";letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.svg{display:block;width:100%}
/* hook */
#hook .ret{position:absolute;left:50%;top:330px;width:620px;height:620px;margin:-310px 0 0 -310px}
#hook .low{position:absolute;left:0;right:0;bottom:0}
#hook .big{font:900 230px/.9 "Unbounded";letter-spacing:-.03em;white-space:nowrap;margin-top:26px;text-shadow:0 0 50px rgba(79,243,255,.55),0 10px 0 rgba(0,0,0,.35)}
#hook .unit{font:700 52px/1.05 "Unbounded";text-transform:uppercase;margin-top:12px;color:var(--ion)}
#hook .sub{font:700 30px/1.2 "JBM";letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-top:20px}
/* aurora */
.scope{position:relative;width:520px;height:520px;margin:30px auto 0}
.scope .img{position:absolute;inset:30px;border-radius:50%;overflow:hidden;background:#000}
.scope img{width:100%;height:100%;object-fit:cover;transform:scale(1.32);filter:saturate(1.3) contrast(1.1)}
.scope svg{position:absolute;inset:0;width:100%;height:100%}
.aurrow{display:grid;grid-template-columns:330px 1fr;gap:26px;align-items:center}
.where{font:700 30px/1.25 "Unbounded";text-transform:none}
/* sun */
.sunbox{position:relative;width:560px;height:560px;margin:24px auto 0}
.sunbox img{position:absolute;inset:40px;width:480px;height:480px;border-radius:50%;object-fit:cover}
.sunbox .glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,181,71,.55) 35%,rgba(255,120,30,.18) 55%,transparent 70%)}
/* launches */
.lc{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center;background:var(--glass);border:2px solid var(--line);padding:22px 26px;margin-top:18px;position:relative}
.lc .d{text-align:center;border-right:2px solid var(--line);padding-right:20px}
.lc .d b{display:block;font:800 52px/1 "Unbounded";color:var(--sol)}
.lc .d span{display:block;margin-top:8px;font:700 22px/1 "JBM";color:var(--dim)}
.lc .r b{display:block;font:800 40px/1.05 "Unbounded";white-space:nowrap;overflow:hidden}
.lc .r p{margin-top:8px;font:600 28px/1.2 "Archivo";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .r small{display:block;margin-top:10px;font:700 21px/1.2 "JBM";letter-spacing:.06em;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .tm{position:absolute;right:20px;top:18px;font:800 22px/1 "JBM";color:var(--ion);letter-spacing:.06em}
/* moon */
.moonrow{display:grid;grid-template-columns:520px 1fr;gap:20px;align-items:center;margin-top:20px}
.moonrow .pct b{display:block;font:900 150px/.9 "Unbounded"}
.moonrow .pct span{display:block;font:700 30px/1.2 "JBM";letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-top:12px}
.phases{display:flex;justify-content:space-between;margin-top:24px}
.phases div{text-align:center;font:700 16px/1 "JBM";color:var(--dim)}
.phases div.on{color:var(--ion)}
/* outro + logo */
#outro .mid{position:absolute;left:0;right:0;top:300px;text-align:center}
#outro .t1{font-size:96px;white-space:normal;line-height:1.05}
.follow{display:inline-flex;align-items:center;justify-content:center;margin-top:46px;min-width:560px;height:118px;border:3px solid var(--ion);font:800 40px/1 "Unbounded";letter-spacing:.06em;color:var(--ion);position:relative}
.ring{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;border:4px solid var(--ion);opacity:0}
#logo{position:absolute;left:50%;top:45%;width:560px;height:560px;margin:-280px 0 0 -280px;opacity:0;z-index:9;overflow:visible}
#wordm{position:absolute;left:0;right:0;top:calc(45% + 300px);text-align:center;opacity:0;z-index:9;font:900 110px/1 "Unbounded";letter-spacing:.12em}
#wordm small{display:block;margin-top:22px;font:700 30px/1 "JBM";letter-spacing:.3em;color:var(--ion)}
#black{position:absolute;inset:0;background:var(--void);opacity:0;z-index:8}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:10;pointer-events:none}
#src{position:absolute;left:70px;right:140px;bottom:120px;font:400 20px/1.3 "JBM";color:rgba(234,242,255,.45);letter-spacing:.04em}
/* cover image: mission control has a target. The subject sits inside a tracking reticle, a mono readout tag above the
   number, a HUD rule at the bottom. Everything centred, glowing and thin-lined: nothing like Crossover's flat poster. */
#thumb{position:absolute;inset:0;display:none;z-index:30;overflow:hidden;background:radial-gradient(62% 40% at 50% 36%,#12305a 0%,#07102a 50%,#020309 100%)}
/* the ALERT cover: a real photo of the story's subject, hazard stripes, and a huge two-line headline.
   TikTok's profile grid shows only the middle 3:4 (y 240-1680), so every word and the photo live in there; the stripes
   at the very top and bottom are only seen on the full 9:16 (YouTube). */
#thumb.alert{background:radial-gradient(70% 50% at 50% 40%,#2a0606 0%,#0a0202 60%,#050505 100%)}
#thumb.alert .ab{position:absolute}
#thumb.alert .bgp{position:absolute;left:0;top:0;width:1080px;height:1640px;object-fit:cover;filter:saturate(1.3) contrast(1.12)}
#thumb.alert .bgf{position:absolute;left:0;right:0;top:860px;height:820px;background:linear-gradient(180deg,rgba(5,5,5,0) 0%,rgba(5,5,5,.85) 55%,#050505 100%)}
#thumb.alert .bgt{position:absolute;left:0;right:0;top:0;height:420px;background:linear-gradient(180deg,rgba(5,5,5,.75),rgba(5,5,5,0))}
#thumb.alert .haz{position:absolute;left:-40px;right:-40px;height:64px;background:repeating-linear-gradient(-45deg,#FFD400 0 46px,#111 46px 92px)}
#thumb.alert .haz.t1{top:0}#thumb.alert .haz.b1{bottom:0}
#thumb.alert .scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 2px,transparent 2px 6px)}
#thumb.alert .bar{position:absolute;left:44px;top:268px;background:#FF1F1F;color:#fff;font:400 84px/1 "Bebas";letter-spacing:.08em;padding:16px 40px 6px;box-shadow:0 0 70px rgba(255,31,31,.7),0 10px 0 #000;white-space:nowrap}
#thumb.alert .bar.calm{background:#00E5FF;color:#04121a;box-shadow:0 0 60px rgba(0,229,255,.55),0 10px 0 #000}
#thumb.alert .lg{position:absolute;right:44px;top:282px;display:flex;align-items:center;gap:12px;font:900 34px/1 "Unbounded";letter-spacing:.08em;color:#fff;text-shadow:0 4px 0 #000;background:rgba(5,5,5,.72);padding:10px 18px 10px 12px;border-radius:14px}
#thumb.alert .lg svg{width:54px;height:54px}
#thumb.alert .t{position:absolute;left:40px;right:40px;bottom:300px}
#thumb.alert .t small{display:block;margin-bottom:20px;font:800 42px/1.1 "JBM";letter-spacing:.1em;color:#FFD400;text-transform:uppercase;white-space:nowrap;text-shadow:0 4px 0 #000}
#thumb.alert .ln{font:400 250px/.86 "Bebas";color:#fff;text-transform:uppercase;white-space:nowrap;text-shadow:0 10px 0 #000,0 0 40px rgba(0,0,0,.8)}
#thumb.alert .ln span{display:inline-block}
#thumb.alert .ln.r span{background:#FF1F1F;padding:0 22px;box-shadow:14px 14px 0 #FFD400}
#thumb.alert .rim{filter:drop-shadow(-8px 0 0 rgba(255,20,60,.8)) drop-shadow(8px 0 0 rgba(0,240,255,.8))}
#thumb .neb{position:absolute;inset:0;background:radial-gradient(42% 26% at 18% 22%,rgba(255,79,216,.28),transparent 70%),radial-gradient(46% 30% at 86% 58%,rgba(79,243,255,.2),transparent 70%),radial-gradient(60% 22% at 50% 96%,rgba(255,181,71,.16),transparent 70%)}
#thumb .cb{position:absolute;width:96px;height:96px;border:5px solid var(--ion);opacity:.85}
#thumb .cb.a{left:44px;top:44px;border-right:0;border-bottom:0}#thumb .cb.b{right:44px;top:44px;border-left:0;border-bottom:0}
#thumb .cb.c{left:44px;bottom:44px;border-right:0;border-top:0}#thumb .cb.d{right:44px;bottom:44px;border-left:0;border-top:0}
#thumb .tl{position:absolute;left:0;right:0;top:92px;display:flex;align-items:center;justify-content:center;gap:20px;font:900 62px/1 "Unbounded";letter-spacing:.14em}
#thumb .tl svg{width:92px;height:92px}
#thumb .ret{position:absolute;left:50%;top:250px;width:960px;height:960px;margin-left:-480px}
#thumb .ret>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#thumb .art{position:absolute;left:150px;top:150px;width:660px;height:660px;display:flex;align-items:center;justify-content:center}
#thumb .art img{width:640px;height:640px;border-radius:50%;object-fit:cover;box-shadow:0 0 120px rgba(255,181,71,.55)}
#thumb .lk{position:absolute;font:800 28px/1 "JBM";letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
#thumb .lk.r span{display:inline-block}#thumb .lk.l{left:40px;top:20px;color:var(--ion)}#thumb .lk.r{left:0;right:0;top:930px;text-align:center;color:var(--ink);opacity:.9}
#thumb .lk i{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--red);box-shadow:0 0 14px var(--red);margin-right:12px;vertical-align:-1px}
#thumb .lo{position:absolute;left:30px;right:30px;top:1236px;bottom:186px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#thumb .k{display:inline-block;border:3px solid var(--ion);background:rgba(4,8,20,.7);color:var(--ion);font:800 40px/1 "JBM";letter-spacing:.18em;text-transform:uppercase;padding:16px 26px;white-space:nowrap;box-shadow:0 0 30px rgba(79,243,255,.35)}
#thumb .bigt{align-self:stretch;text-align:center;margin-top:26px;font:900 270px/.9 "Unbounded";letter-spacing:-.03em;white-space:nowrap;color:#fff;text-shadow:0 0 50px rgba(79,243,255,.75),0 0 120px rgba(79,243,255,.35)}
#thumb .u{align-self:stretch;margin-top:20px;text-align:center;font:800 58px/1.1 "Unbounded";color:var(--sol);text-transform:uppercase;white-space:nowrap;text-shadow:0 0 30px rgba(255,181,71,.45)}
#thumb .ft{position:absolute;left:150px;right:150px;bottom:100px;display:flex;justify-content:space-between;align-items:center;font:700 28px/1 "JBM";letter-spacing:.2em;color:var(--dim);text-transform:uppercase;border-top:2px solid var(--line);padding-top:20px}

/* the NEON cover (mini games): a colour burst, real planet photos, and a huge glossy two-line headline */
#thumb.neon{background:#12002a}
#thumb.neon .ab{position:absolute}
#thumb.neon .burst{position:absolute;left:540px;top:870px;width:3200px;height:3200px;margin:-1600px 0 0 -1600px;background:repeating-conic-gradient(from 7deg,#ff2bd6 0 9deg,#7a1cff 9deg 18deg,#00e5ff 18deg 27deg,#3b0a8f 27deg 36deg);opacity:.6}
#thumb.neon .glow{position:absolute;left:540px;top:870px;width:1400px;height:1400px;margin:-700px 0 0 -700px;background:radial-gradient(circle,rgba(255,255,255,.6),rgba(255,43,214,.25) 35%,transparent 62%)}
#thumb.neon .vig{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 42%,transparent 40%,rgba(10,0,30,.8) 100%)}
#thumb.neon .lg{position:absolute;left:0;right:0;top:262px;display:flex;justify-content:center;align-items:center;gap:14px;font:900 44px/1 "Unbounded";letter-spacing:.08em;color:#fff;text-shadow:0 5px 0 #1a0033}
#thumb.neon .lg svg{width:62px;height:62px}
#thumb.neon .chip{position:absolute;left:50%;top:346px;transform:translateX(-50%) rotate(-3deg);max-width:960px;width:max-content;background:#00e5ff;color:#12002a;font:900 50px/1.08 "Unbounded";padding:22px 38px;border-radius:60px;box-shadow:0 0 0 9px #12002a,0 0 60px #00e5ff;text-transform:uppercase;text-align:center}
#thumb.neon .bang{position:absolute;right:20px;top:470px;width:300px;height:300px;transform:rotate(14deg) scale(.8)}
#thumb.neon .bang b{position:absolute;inset:0;display:grid;place-items:center;font:900 116px/1 "Unbounded";color:#1a0033;transform:rotate(-6deg)}
#thumb.neon .vs{position:absolute;left:540px;top:870px;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;background:#FFE14D;border:10px solid #1a0033;display:grid;place-items:center;font:900 96px/1 "Unbounded";color:#1a0033;box-shadow:0 0 60px rgba(255,225,77,.8);transform:rotate(-8deg)}
#thumb.neon .qm{position:absolute;display:grid;place-items:center;font:900 220px/1 "Unbounded";color:#fff;text-shadow:0 0 40px #ff2bd6,0 10px 0 #1a0033}
#thumb.neon .t{position:absolute;left:0;right:0;bottom:300px;text-align:center}
#thumb.neon .ln{font:900 170px/1.04 "Unbounded";text-transform:uppercase;white-space:nowrap}
#thumb.neon .ln span{display:inline-block;position:relative}
#thumb.neon .ln .nu{color:#1a0033;-webkit-text-stroke:22px #1a0033;text-shadow:0 14px 0 #1a0033}
#thumb.neon .ln .nf{position:absolute;left:0;top:0;background:linear-gradient(180deg,#ffffff 0%,#fff6a8 35%,#ffb21e 62%,#ff4f2e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,43,214,.8))}
#thumb.neon .ln.c .nf{background:linear-gradient(180deg,#f2ffff 0%,#8ff8ff 40%,#00b3ff 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 30px rgba(0,229,255,.9))}
/* HIGHER OR LOWER, Liftoff edition. Read top to bottom like the game: the title, the number you know, the question with
   two giant buttons, then the mystery number. Green = higher, red = lower, amber = unknown. Stars, HUD and the rocket
   ending are the daily report's. */
.ttl{position:absolute;left:0;right:0;top:0;text-align:center;font:900 96px/1 "Unbounded";letter-spacing:-.01em;white-space:nowrap;text-transform:uppercase;text-shadow:0 0 40px rgba(79,243,255,.35),0 6px 0 rgba(0,0,0,.4)}
.ttl svg{width:.6em;height:.6em;vertical-align:.03em;margin:0 .08em}
.ttl .u{color:var(--aur)}.ttl .d{color:var(--red)}
.rnd{position:absolute;left:0;right:0;top:116px;text-align:center;font:800 26px/1 "JBM";letter-spacing:.24em;color:var(--ion);text-transform:uppercase}
.rnd i{display:inline-block;width:46px;height:3px;background:var(--ion);vertical-align:8px;margin:0 18px;box-shadow:0 0 10px var(--ion)}
.sc .pn{position:absolute;left:0;right:0;height:330px;display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:center;background:var(--glass);border:3px solid var(--line);padding:20px 28px}
.pn::before,.pn::after{content:"";position:absolute;width:24px;height:24px;border:4px solid var(--ion)}
.pn::before{left:-4px;top:-4px;border-right:0;border-bottom:0}.pn::after{right:-4px;bottom:-4px;border-left:0;border-top:0}
.pn.a{top:160px}.pn.b{top:820px;border-color:rgba(255,181,71,.6);border-style:dashed}
.pn.b::before,.pn.b::after{border-color:var(--sol)}
.pn.b.win-u{border-color:var(--aur);border-style:solid;box-shadow:0 0 50px rgba(92,255,168,.25)}.pn.b.win-u::before,.pn.b.win-u::after{border-color:var(--aur)}
.pn.b.win-d{border-color:var(--red);border-style:solid;box-shadow:0 0 50px rgba(255,90,90,.25)}.pn.b.win-d::before,.pn.b.win-d::after{border-color:var(--red)}
.pl{width:220px;height:220px}.pl svg{width:100%;height:100%;overflow:visible}
.pv{min-width:0;position:relative}
.pv .nm2{font:900 62px/1 "Unbounded";text-transform:uppercase;white-space:nowrap}
.pv .lb2{font:800 26px/1.2 "JBM";letter-spacing:.12em;color:var(--ion);text-transform:uppercase;margin-top:12px;white-space:nowrap}
.pn.b .lb2{color:var(--sol)}
.val{position:relative;height:150px;margin-top:14px}
