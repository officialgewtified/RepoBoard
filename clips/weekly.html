<!doctype html>
<html><head><meta charset="utf-8"><title>Crossover weekly recap</title>
<style>
@font-face{font-family:"Archivo";src:url(../fonts/archivo-x.woff) format("woff");font-weight:400 900;font-stretch:62% 125%}
@font-face{font-family:"Big Shoulders";src:url(../fonts/big-shoulders.woff) format("woff");font-weight:700 900}
:root{--night:#111113;--deep:#1A1A1D;--deep2:#232327;--rim:#2C2C31;--paper:#F4F4F5;--haze:#A1A1AA;--dim:#63636B;--go:#4ADE80;--stop:#F87171;
 --hero:radial-gradient(75% 60% at 50% 40%,#303035 0%,#1B1B1E 58%,#141416 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--night)}
body{font-family:"Archivo",sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased}
#sky{position:absolute;inset:0;background:radial-gradient(70% 55% at 50% -10%,rgba(255,255,255,.08),transparent 70%),linear-gradient(180deg,#18181B 0%,#111113 50%)}
.top{position:absolute;left:80px;right:80px;top:44px;display:flex;justify-content:space-between;align-items:center}
.wm{font:900 46px/1 "Big Shoulders";letter-spacing:.07em;text-transform:uppercase}
.dt{font:700 22px/1 "Archivo";font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;color:var(--haze);padding:12px 18px;border-radius:999px;background:rgba(244,244,245,.07)}
.nav{position:absolute;left:80px;right:80px;bottom:46px;height:3px;border-radius:3px;background:rgba(244,244,245,.14)}
.nav i{position:absolute;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--paper);transform:translateX(-50%)}
.sc{position:absolute;left:80px;right:80px;top:120px;bottom:84px;opacity:0;will-change:transform}
.hero{position:relative;height:100%;border-radius:48px;background:var(--hero);border:2px solid var(--rim);overflow:hidden;isolation:isolate;padding:44px 56px}
.wmk{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:-1;font:900 520px/.78 "Big Shoulders";text-transform:uppercase;white-space:nowrap;color:transparent;
 background:linear-gradient(180deg,rgba(244,244,245,.13),rgba(244,244,245,.02));-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:2px rgba(244,244,245,.08)}
.k{font:700 26px/1 "Archivo";font-stretch:116%;letter-spacing:.16em;text-transform:uppercase;color:var(--haze)}
.k.go{color:var(--go)}
.h2{font:500 76px/.95 "Archivo";font-stretch:112%;text-transform:uppercase;letter-spacing:-.01em}
.disc{border-radius:50%;display:grid;place-items:center;font:900 1px/1 "Big Shoulders";color:#fff;letter-spacing:.02em;
 box-shadow:0 40px 70px -26px rgba(0,0,0,.8),inset 0 0 0 3px rgba(255,255,255,.14),inset 0 -24px 50px rgba(0,0,0,.35)}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:14px 22px;font:700 26px/1 "Archivo";font-stretch:94%;background:rgba(244,244,245,.08)}
.pill i{width:12px;height:12px;border-radius:50%;background:var(--c,var(--go))}
.view{display:inline-flex;align-items:center;justify-content:center;min-height:84px;padding:0 40px;border-radius:999px;background:var(--paper);color:var(--night);font:800 30px/1 "Archivo";text-transform:uppercase;letter-spacing:.06em}
/* hook */
.hk{display:grid;grid-template-columns:1.1fr .9fr;height:100%;align-items:center}
.hk .big{font:900 440px/.8 "Big Shoulders";margin:16px 0 0}
.hk .lab{font:800 52px/1 "Archivo";font-stretch:118%;letter-spacing:.06em;text-transform:uppercase;margin-top:18px}
.hk .who{display:flex;flex-direction:column;align-items:center;gap:30px;text-align:center}
.hk .nm{font:500 64px/1 "Archivo";font-stretch:112%;text-transform:uppercase}
/* game */
.gm{display:flex;flex-direction:column;height:100%}
.gtop{display:flex;justify-content:space-between;align-items:flex-start}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:40px;margin-top:26px}
.side{display:flex;align-items:center;gap:28px;min-width:0}.side .t{min-width:0}.side .t b{white-space:nowrap;overflow:hidden}
.side.r{flex-direction:row-reverse;text-align:right}
.side .t b{display:block;font:500 54px/1 "Archivo";font-stretch:112%;text-transform:uppercase}
.side .t span{display:block;font:700 26px/1 "Archivo";color:var(--haze);margin-top:10px;letter-spacing:.06em}
.score{display:flex;align-items:center;gap:30px;font:900 230px/.8 "Big Shoulders"}
.score s{text-decoration:none;color:var(--dim)}
.score em{font:800 26px/1 "Archivo";font-style:normal;letter-spacing:.14em;color:var(--haze);text-align:center}
.lsb{margin:34px auto 0;border-collapse:collapse;font:700 28px/1 "Archivo"}
.lsb td,.lsb th{padding:10px 22px;text-align:center}
.lsb th{font-size:20px;letter-spacing:.14em;color:var(--haze);font-weight:800}
.lsb td:first-child{text-align:left;font:900 34px/1 "Big Shoulders";letter-spacing:.04em}
.lsb td.t{font:900 34px/1 "Big Shoulders"}
.lsb tr.w td.t{color:var(--paper)} .lsb tr:not(.w) td.t{color:var(--dim)}
.stars{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:auto}
.star{padding:24px 26px;border-radius:28px;background:rgba(17,17,19,.6);border:2px solid var(--rim)}
.star b{display:flex;align-items:center;gap:12px;font:800 30px/1.1 "Archivo";text-transform:uppercase;white-space:nowrap;overflow:hidden}
.star b i{width:10px;height:30px;border-radius:5px;flex:none}
.star span{display:block;margin-top:12px;font:600 26px/1.2 "Archivo";color:#d4d4d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* leaderboards */
.bd{display:flex;flex-direction:column;height:100%}
.rows{display:flex;flex-direction:column;gap:16px;margin-top:34px}
.row{display:grid;grid-template-columns:70px 1fr 220px;align-items:center;gap:24px;padding:16px 26px;border-radius:26px;background:rgba(17,17,19,.55);border:2px solid var(--rim);position:relative;overflow:hidden}
.row .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(244,244,245,.10),rgba(244,244,245,.03));z-index:0;transform-origin:left}
.row>*{position:relative;z-index:1}
.row .rk{font:900 60px/1 "Big Shoulders";color:var(--haze)}
.row:first-child .rk{color:var(--paper)}
.row .nm b{display:flex;align-items:center;gap:12px;font:800 36px/1.1 "Archivo";text-transform:uppercase}
.row .nm b i{width:10px;height:32px;border-radius:5px}
.row .nm span{display:block;margin-top:8px;font:600 24px/1 "Archivo";color:var(--haze)}
.row .v{text-align:right;font:900 84px/1 "Big Shoulders"}
.row .v small.u{}
.row .v small{font:800 20px/1 "Archivo";letter-spacing:.12em;color:var(--haze);margin-left:8px}
/* standings */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:40px}
.tile{display:flex;align-items:center;gap:22px;padding:24px;border-radius:28px;background:rgba(17,17,19,.55);border:2px solid var(--rim)}
.tile .t b{display:block;font:800 32px/1 "Archivo";text-transform:uppercase}
.tile .t span{display:block;font:900 72px/1 "Big Shoulders";margin-top:8px}
/* outro + logo loop */
.ot{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:34px}
.ring{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid var(--paper);opacity:0}
#logo{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);opacity:0;z-index:9}
#logo span{display:block;font:900 520px/.8 "Big Shoulders"}
#logo i{position:absolute;right:-60px;bottom:16px;width:92px;height:92px;border-radius:50%;background:var(--go)}
#sig{position:absolute;left:0;right:0;top:calc(44% + 250px);text-align:center;opacity:0;z-index:9}
#sig b{display:block;font:900 96px/1 "Big Shoulders";letter-spacing:.08em}
#sig small{display:block;margin-top:14px;font:700 26px/1 "Archivo";font-stretch:116%;letter-spacing:.2em;text-transform:uppercase;color:var(--haze)}
/* hook graphic */
.hk .vzw{width:760px;height:520px}
.vzw svg{width:100%;height:100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
/* every final */
.fg{display:grid;gap:20px;margin-top:26px;flex:1;min-height:0}
.ft{border-radius:30px;background:rgba(17,17,19,.6);border:2px solid var(--rim);padding:18px 26px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:0}
.ft.on{border-color:var(--paper);background:rgba(44,44,50,.92);box-shadow:0 0 0 6px rgba(244,244,245,.08)}
.ft .tr{display:flex;align-items:center;gap:16px}
.ft .tr i{width:12px;height:46px;border-radius:6px;flex:none}
.ft .tr b{font:900 70px/1 "Big Shoulders";flex:1;color:var(--dim)}
.ft .tr s{text-decoration:none;font:900 84px/1 "Big Shoulders";color:var(--dim)}
.ft .tr.w b,.ft .tr.w s{color:var(--paper)}
.ft em{font:800 20px/1 "Archivo";font-style:normal;letter-spacing:.14em;color:var(--haze);margin-top:6px}
.col{display:flex;flex-direction:column;height:100%}
/* by the numbers */
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:auto;margin-bottom:auto}
.nm4{padding:34px 30px;border-radius:32px;background:rgba(17,17,19,.6);border:2px solid var(--rim);min-width:0}
.nm4 b{display:block;font:900 190px/.85 "Big Shoulders"}
.nm4 span{display:block;margin-top:18px;font:800 30px/1.1 "Archivo";font-stretch:110%;text-transform:uppercase;letter-spacing:.04em}
.nm4 small{display:block;margin-top:10px;font:600 26px/1.2 "Archivo";color:var(--haze);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* leader on the field */
.ld{display:grid;grid-template-columns:1.15fr .85fr;grid-template-rows:minmax(0,1fr);gap:40px;flex:1;min-height:0;margin-top:20px}
.ld .sp{display:flex;flex-direction:column;min-width:0}
.ld .who{display:flex;align-items:baseline;gap:20px;white-space:nowrap}
.ld .who b{font:500 62px/1 "Archivo";font-stretch:112%;text-transform:uppercase;overflow:hidden}
.ld .who span{font:700 26px/1 "Archivo";color:var(--haze);letter-spacing:.08em}
.ld .vzw{flex:1;min-height:0;margin-top:10px}
.mini{display:flex;flex-direction:column;gap:12px;justify-content:center}
.mr2{display:grid;grid-template-columns:50px 1fr auto;gap:18px;align-items:center;padding:14px 22px;border-radius:24px;background:rgba(17,17,19,.6);border:2px solid var(--rim)}
.mr2:first-child{border-color:var(--paper)}
.mr2 .rk{font:900 48px/1 "Big Shoulders";color:var(--haze)}
.mr2 b{display:flex;align-items:center;gap:10px;font:800 28px/1.1 "Archivo";text-transform:uppercase;white-space:nowrap;overflow:hidden}
.mr2 b i{width:8px;height:26px;border-radius:4px;flex:none}
.mr2 small{display:block;margin-top:6px;font:600 21px/1 "Archivo";color:var(--haze);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr2 .v{font:900 64px/1 "Big Shoulders"}
/* player of the week */
.pw{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:40px;flex:1;min-height:0;margin-top:14px}
.pw .l{display:flex;flex-direction:column;min-width:0}
.pw .nmw{font:500 110px/.92 "Archivo";font-stretch:112%;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.pw .chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.pw .fp{display:flex;align-items:baseline;gap:16px;margin-top:26px}
.pw .fp b{font:900 150px/.85 "Big Shoulders";color:var(--go)}
.pw .fp span{font:800 28px/1 "Archivo";letter-spacing:.12em;text-transform:uppercase;color:var(--haze)}
.hon{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:auto}
.hon div{padding:16px 20px;border-radius:22px;background:rgba(17,17,19,.6);border:2px solid var(--rim);min-width:0}
.hon b{display:flex;align-items:center;gap:10px;font:800 24px/1.1 "Archivo";text-transform:uppercase;white-space:nowrap;overflow:hidden}
.hon b i{width:8px;height:24px;border-radius:4px;flex:none}
.hon small{display:block;margin-top:6px;font:600 20px/1.2 "Archivo";color:var(--haze);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crown{display:inline-flex;align-items:center;gap:12px;padding:14px 24px;border-radius:999px;background:var(--go);color:var(--night);font:900 30px/1 "Archivo";font-stretch:110%;letter-spacing:.1em;text-transform:uppercase;align-self:flex-start}
/* NBA shot chart */
.nb{display:grid;grid-template-columns:760px 1fr;grid-template-rows:minmax(0,1fr);gap:50px;height:100%}
.nb .vzw{height:100%}
.nb .r{display:flex;flex-direction:column;justify-content:center;min-width:0}
.nb .nmw{font:500 92px/.92 "Archivo";font-stretch:112%;text-transform:uppercase;white-space:nowrap;overflow:hidden;margin-top:14px}
.nb .ctx{margin-top:16px;font:700 28px/1.2 "Archivo";color:var(--haze)}
.nb .big{display:flex;align-items:baseline;gap:18px;margin-top:20px}
.nb .big b{font:900 260px/.8 "Big Shoulders"}
.nb .big span{font:800 34px/1 "Archivo";letter-spacing:.12em;color:var(--haze)}
.nb .st{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
.nb .st div{padding:16px 18px;border-radius:22px;background:rgba(17,17,19,.6);border:2px solid var(--rim)}
.nb .st b{display:block;font:900 64px/1 "Big Shoulders"}
.nb .st span{display:block;margin-top:6px;font:800 18px/1 "Archivo";letter-spacing:.12em;color:var(--haze)}
/* next week */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;flex:1;min-height:0}
.st2{display:flex;flex-direction:column;justify-content:center;padding:10px 20px;border-radius:22px;background:rgba(17,17,19,.6);border:2px solid var(--rim);min-height:0}
.st2 b{display:flex;align-items:center;gap:10px;font:900 46px/1 "Big Shoulders";white-space:nowrap}
.st2 b i{font-style:normal;color:var(--haze);font-size:30px}
.st2 small{display:block;margin-top:6px;font:700 19px/1.1 "Archivo";letter-spacing:.06em;color:var(--haze);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:30px;margin-top:30px}
.mu .tm{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.mu .tm b{font:500 66px/1 "Archivo";font-stretch:112%;text-transform:uppercase}
.mu .tm span{font:900 70px/1 "Big Shoulders";color:var(--haze)}
.mu .at{font:900 140px/1 "Big Shoulders";color:var(--dim)}
.mlead{display:flex;justify-content:center;gap:18px;margin-top:auto}
.frame{align-self:center;margin-top:26px;font:700 36px/1.2 "Archivo";color:#e4e4e7;text-align:center}
.mu .tm small{font:700 24px/1 "Archivo";letter-spacing:.08em;color:var(--haze);text-transform:uppercase}
/* thumbnail: the Crossover poster (same look as the shorts' covers) in 16:9. Team colour full-bleed, halftone, the brand
   X crossing behind a giant hard-shadowed number, black-and-volt bars. */
#thumb{position:absolute;inset:0;display:none;z-index:20;overflow:hidden;--volt:#D7FF3A;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 85%,#fff) 0%,var(--tc) 40%,color-mix(in srgb,var(--tc) 45%,#000) 100%)}
#thumb .ht{position:absolute;inset:-20%;background:radial-gradient(circle,rgba(0,0,0,.28) 1.6px,transparent 2px) 0 0/18px 18px;transform:rotate(18deg);opacity:.55}
#thumb .sp{position:absolute;left:-30%;right:-30%;top:-10%;height:120%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 26px,transparent 26px 120px)}
#thumb .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 64%,rgba(0,0,0,.6) 100%)}
#thumb .xb{position:absolute;width:4400px;height:190px;margin:-95px 0 0 -2200px}
#thumb .xb.a{background:var(--volt);transform:rotate(-38deg)}#thumb .xb.b{background:#000;transform:rotate(38deg)}
#thumb .tb{position:absolute;left:64px;top:52px;display:flex;gap:22px;align-items:center;z-index:2}
#thumb .wm{background:#fff;color:#000;font:900 60px/1 "Big Shoulders";letter-spacing:.06em;padding:11px 22px 8px;transform:skewX(-12deg)}
#thumb .wm span,#thumb .cl span,#thumb .bar span,#thumb .pr span,#thumb .wkb span{display:inline-block;transform:skewX(12deg)}
#thumb .when{background:#000;color:var(--volt);font:900 32px/1 "Archivo";font-stretch:118%;letter-spacing:.12em;text-transform:uppercase;padding:16px 22px;transform:skewX(-12deg)}
#thumb .cv{position:absolute;left:64px;top:190px;bottom:60px;width:1080px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;z-index:2}
#thumb .cn{font:900 520px/.76 "Big Shoulders";color:#fff;white-space:nowrap;letter-spacing:-.01em;text-shadow:16px 16px 0 #000;padding-right:16px}
#thumb .cl{margin-top:34px;background:#000;color:var(--volt);font:900 76px/1 "Big Shoulders";letter-spacing:.05em;text-transform:uppercase;padding:12px 26px 7px;transform:skewX(-12deg);white-space:nowrap}
#thumb .fn{margin-top:26px;font:900 42px/1 "Archivo";font-stretch:118%;letter-spacing:.1em;color:#fff;text-transform:uppercase;background:#000;padding:9px 14px 7px}
#thumb .ln{font:900 190px/.82 "Big Shoulders";color:#fff;text-transform:uppercase;white-space:nowrap;text-shadow:10px 10px 0 #000;max-width:100%;overflow:hidden;padding:0 12px 12px 0;margin-top:6px}
#thumb .bar{margin-top:14px;display:inline-flex;background:#000;color:#fff;font:700 34px/1 "Archivo";padding:15px 22px;transform:skewX(-12deg)}
#thumb .rt{position:absolute;right:80px;top:150px;bottom:70px;width:620px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:44px;z-index:2}
#thumb .ct{width:560px;background:#000;padding:18px 14px 12px;transform:rotate(4deg);box-shadow:16px 16px 0 var(--volt)}
#thumb .ct svg{display:block;width:100%;height:auto;max-height:520px}
#thumb .wkb{background:#fff;color:#000;transform:skewX(-12deg);box-shadow:16px 16px 0 #000;padding:16px 40px 6px;text-align:center}
#thumb .wkb small{display:block;font:900 44px/1 "Archivo";font-stretch:118%;letter-spacing:.2em}
#thumb .wkb b{display:block;font:900 300px/.82 "Big Shoulders"}
#thumb .pr{background:var(--volt);color:#000;font:900 58px/1 "Big Shoulders";letter-spacing:.04em;text-transform:uppercase;padding:16px 28px 11px;transform:skewX(-12deg);white-space:nowrap;box-shadow:12px 12px 0 #000}
</style></head><body>
<div id="sky"></div>
<div class="top"><span class="wm" id="wm"></span><span class="dt" id="dt"></span></div>
<div id="stage"></div>
<div class="nav"><i id="dot"></i></div>
<div id="logo"><span>X</span><i></i></div>
<div id="sig"><b>CROSSOVER</b><small>Best stats · every day</small></div>
<div id="thumb"></div>
<script src="viz.js"></script>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>1-Math.pow(1-clamp(x),3);
const pop=x=>{x=clamp(x);if(x>=1)return 1;const c=1.70158*1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let D=null,SC=[],TOTAL=30,SFX=[];const INTRO=.4,TAIL=2.6,MIN=492;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shade(hex,f){const h=String(hex||"#71717a").replace("#","");if(h.length<6)return "#3f3f46";return "#"+[0,2,4].map(i=>Math.round(parseInt(h.slice(i,i+2),16)*(1-f)).toString(16).padStart(2,"0")).join("")}
const vz=(v,c,tm,cls="vzw")=>`<div class="${cls}">${VIZ.html(v,c,tm)}</div>`;
const disc=(tm,c,size)=>`<div class="disc" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.36)}px;background:radial-gradient(circle at 35% 28%,${c},${shade(c,.55)})">${esc(tm||"")}</div>`;
function fit(el,min){let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&fs>min){fs-=2;el.style.fontSize=fs+"px"}}
function build(data){D=data;SC=[];SFX=[];
 document.getElementById("wm").textContent=D.brand;document.getElementById("dt").textContent=`${D.title} · ${D.range}`;
 let h="",t=INTRO;
 const add=(s,dur,html)=>{const v=D.dur&&D.dur[s.id],off=s.kind==="hook"?.1:.35;if(v!=null)dur=Math.max(3,v+off+.6);
  SC.push({id:s.id,kind:s.kind,chapter:s.chapter,t0:t,t1:t+dur,va:t+off});t+=dur;h+=`<div class="sc" id="${s.id}">${html}</div>`};
 for(const s of D.scenes){
  if(s.kind==="hook")add(s,5,`<div class="hero"><div class="wmk">Week ${D.week}</div><div class="hk"><div><div class="k go">${esc(D.title)}</div><div class="big">${esc(s.big)}</div><div class="lab">${esc(s.label)}</div></div>
   <div class="who">${s.viz?vz(s.viz,s.color,s.tm):disc(s.tm,s.color,300)}<div class="nm">${esc(s.who)}</div><span class="pill"><i></i>${esc(s.line)}</span></div></div></div>`);
