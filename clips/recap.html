<!doctype html>
<html><head><meta charset="utf-8"><title>Crossover stats video</title>
<style>
@font-face{font-family:"Archivo";src:url(../fonts/archivo-x.woff) format("woff");font-weight:400 900;font-stretch:62% 125%}
@font-face{font-family:"Big Shoulders";src:url(../fonts/big-shoulders.woff) format("woff");font-weight:700 900}
/* Studio look, same as the Crossover site and Early Bird: graphite and white, like a sneaker drop page */
:root{--night:#111113;--deep:#1A1A1D;--deep2:#232327;--rim:#2C2C31;--paper:#F4F4F5;--haze:#A1A1AA;--dim:#63636B;--go:#4ADE80;--stop:#F87171;
 --hero:radial-gradient(75% 55% at 55% 42%,#303035 0%,#1B1B1E 58%,#141416 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--night)}
body{font-family:"Archivo",sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased}
#sky{position:absolute;inset:0;background:radial-gradient(80% 45% at 50% -5%,rgba(255,255,255,.08),transparent 70%),linear-gradient(180deg,#18181B 0%,#111113 45%)}
/* top bar: wordmark, date, and the carousel bar with its dot */
.top{position:absolute;left:72px;right:72px;top:84px;display:flex;justify-content:space-between;align-items:center}
.wm{font:900 50px/1 "Big Shoulders";letter-spacing:.07em;text-transform:uppercase}
.dt{font:700 24px/1 "Archivo";font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;color:var(--haze);padding:14px 20px;border-radius:999px;background:rgba(244,244,245,.07)}
.nav{position:absolute;left:50%;top:166px;width:300px;margin-left:-150px;height:3px;border-radius:3px;background:rgba(244,244,245,.16)}
.nav i{position:absolute;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--paper);transform:translateX(-50%)}
/* scenes: each one is a card that swipes in from the right and out to the left */
.sc{position:absolute;left:72px;right:132px;top:210px;bottom:540px;opacity:0;will-change:transform}
.sc.tall{bottom:400px}
.hero{position:relative;height:100%;border-radius:60px;background:var(--hero);border:2px solid var(--rim);overflow:hidden;isolation:isolate;padding:46px 46px 40px;display:flex;flex-direction:column}
.wmk{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:-1;font:900 560px/.78 "Big Shoulders";text-transform:uppercase;white-space:nowrap;color:transparent;
 background:linear-gradient(180deg,rgba(244,244,245,.16),rgba(244,244,245,.03));-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:2px rgba(244,244,245,.10);letter-spacing:-.005em}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.h2{font:500 92px/.92 "Archivo";font-stretch:112%;text-transform:uppercase;letter-spacing:-.01em;min-width:0;flex:1}
.h2 .fit{display:block;white-space:nowrap}
.rank{text-align:right;font:700 24px/1.4 "Archivo";font-stretch:90%;letter-spacing:.1em;text-transform:uppercase;color:var(--haze);flex:none}
.rank b{display:block;font:900 96px/1 "Big Shoulders";color:var(--paper);letter-spacing:0}
.shot{position:relative;flex:1;min-height:0;margin-top:10px}
.ph{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end}
.ph.d{align-items:center}
.ph img{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:50% 100%;transform-origin:50% 100%;
 -webkit-mask-image:linear-gradient(180deg,#000 82%,transparent 100%);mask-image:linear-gradient(180deg,#000 82%,transparent 100%);filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.gs{position:absolute;left:50%;top:50%;width:320px;height:40px;margin:150px 0 0 -160px;border-radius:50%;background:rgba(0,0,0,.6);filter:blur(18px);z-index:-1}
.disc{width:340px;height:340px;border-radius:50%;display:grid;place-items:center;font:900 140px/1 "Big Shoulders";letter-spacing:.02em;color:#fff;
 box-shadow:0 60px 90px -30px rgba(0,0,0,.8),inset 0 0 0 3px rgba(255,255,255,.14),inset 0 -30px 60px rgba(0,0,0,.35)}
.stamp{position:absolute;right:6px;top:10px;width:210px;height:210px;border-radius:50%;background:var(--paper);color:var(--night);display:grid;place-items:center;text-align:center;
 font:900 40px/.9 "Big Shoulders";text-transform:uppercase;letter-spacing:.02em;box-shadow:0 30px 50px -20px rgba(0,0,0,.7);padding:24px}
.stamp small{display:block;font:800 17px/1.1 "Archivo";letter-spacing:.12em;margin-top:6px}
.spec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:end;margin-top:14px}
.spec .nm{font:800 40px/1.15 "Archivo";text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden}
.spec .s2{font:600 30px/1.2 "Archivo";font-stretch:90%;color:var(--haze);white-space:nowrap}
.spec .s2 b{color:var(--paper)}
.spec .pr{grid-row:1/3;grid-column:2;text-align:right}
.spec .pr b{display:block;font:900 168px/.86 "Big Shoulders"}
.spec .pr span{display:block;font:800 26px/1 "Archivo";font-stretch:110%;letter-spacing:.12em;text-transform:uppercase;color:var(--haze);margin-top:8px}
.tags{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.tag{display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:15px 22px;font:700 29px/1 "Archivo";font-stretch:92%;background:rgba(244,244,245,.08)}
.tag i{width:14px;height:14px;border-radius:50%;background:var(--c,var(--haze))}
.view{margin-top:22px;min-height:92px;border-radius:999px;background:var(--paper);color:var(--night);display:flex;align-items:center;justify-content:center;gap:14px;
 font:800 32px/1 "Archivo";text-transform:uppercase;letter-spacing:.06em;padding:0 30px;white-space:nowrap}
.view svg{width:30px;height:30px;flex:none}
/* card strip under the hero */
.strip{position:absolute;left:72px;right:132px;top:1402px;display:flex;gap:14px;opacity:0}
.c2{flex:1;min-width:0;display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;padding:14px;border-radius:26px;background:var(--deep);border:2px solid var(--rim)}
.c2.on{border-color:var(--paper)}
.c2 .av{width:76px;height:76px;border-radius:20px;overflow:hidden;display:grid;place-items:center;font:900 30px/1 "Big Shoulders";color:#fff;background:var(--deep2)}
.c2 .av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.c2 b{display:block;font:800 21px/1.15 "Archivo";text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c2 small{display:block;font:600 19px/1.2 "Archivo";font-stretch:88%;color:var(--haze);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* hook */
#hook .h2{font-size:70px}
#hook .spec .pr b{font-size:260px}
/* scores */
.k{font:700 28px/1 "Archivo";font-stretch:116%;letter-spacing:.16em;text-transform:uppercase;color:var(--haze)}
.grid{display:grid;gap:16px;margin-top:30px}
.g{padding:18px 20px;border-radius:26px;background:rgba(17,17,19,.55);border:2px solid var(--rim)}
.r{display:flex;align-items:center;gap:12px;height:60px}
.r i{width:12px;height:12px;border-radius:50%;flex:none;background:var(--c)}
.r b{font:900 52px/1 "Big Shoulders";flex:1;color:var(--dim)}
.r s{text-decoration:none;font:900 52px/1 "Big Shoulders";color:var(--dim)}
.r.w b,.r.w s{color:var(--paper)}
.r b u{text-decoration:none;font-size:.58em;color:var(--haze);margin-right:8px;vertical-align:.14em}
.g em{display:block;font:800 19px/1 "Archivo";font-style:normal;letter-spacing:.14em;color:var(--haze);margin-top:6px}
.c3 .r b,.c3 .r s{font-size:46px}
.ph.vs{gap:10px}.vs .disc{width:270px;height:270px;font-size:100px}.vs .at{font:900 96px/1 "Big Shoulders";color:var(--haze)}
.view.note{margin-top:auto;font-size:28px;white-space:normal;text-align:center;line-height:1.15;padding:18px 34px}
/* more */
.mlist{display:flex;flex-direction:column;gap:18px;margin-top:30px}
.mr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;align-items:center;padding:18px;border-radius:34px;background:rgba(17,17,19,.55);border:2px solid var(--rim)}
.mr .av{width:150px;height:150px;border-radius:28px;overflow:hidden;display:grid;place-items:center;font:900 54px/1 "Big Shoulders";color:#fff}
.mr .av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.mr b{display:block;font:900 66px/.9 "Big Shoulders";text-transform:uppercase;white-space:nowrap}
.mr small{display:flex;align-items:center;gap:10px;margin-top:10px;font:600 29px/1.2 "Archivo";color:var(--haze);white-space:nowrap}
.mr small em{font-style:normal;font:800 19px/1 "Archivo";letter-spacing:.12em;padding:8px 11px;border-radius:999px;background:rgba(244,244,245,.1);color:var(--paper)}
/* outro */
#outro .h2{font-size:110px;margin-top:auto}
#outro .view{margin-bottom:auto;margin-top:40px;min-height:120px;font-size:42px}
.ring{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid var(--paper);opacity:0;pointer-events:none}
.src{position:absolute;left:72px;right:72px;bottom:150px;font:600 22px/1.3 "Archivo";color:var(--dim)}
/* the Crossover X: the intro zooms through it, and the video ends on it so it loops */
#logo{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;z-index:9}
#logo span{display:block;font:900 640px/.8 "Big Shoulders";color:var(--paper)}
#logo i{position:absolute;right:-70px;bottom:20px;width:110px;height:110px;border-radius:50%;background:var(--go)}
#sig{position:absolute;left:0;right:0;top:calc(46% + 300px);text-align:center;opacity:0;z-index:9}
#sig b{display:block;font:900 120px/1 "Big Shoulders";letter-spacing:.08em;color:var(--paper)}
#sig small{display:block;margin-top:18px;font:700 30px/1 "Archivo";font-stretch:116%;letter-spacing:.2em;text-transform:uppercase;color:var(--haze)}
</style></head><body>
<div id="sky"></div>
<div class="top"><span class="wm" id="wm"></span><span class="dt" id="dt"></span></div>
<div class="nav"><i id="dot"></i></div>
<div id="stage"></div>
<div class="strip" id="strip"></div>
<div class="src" id="src"></div>
<div id="logo"><span>X</span><i></i></div>
<div id="sig"><b>CROSSOVER</b><small>Best stats · every day</small></div>
<script>
/* build(data) lays out every scene once; render(t) poses the frame at t seconds. Same t, same picture, every time.
   SFX lists the moments that get a sound (whoosh on each swipe, pop on each pop-up); render.js mixes them in. */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>1-Math.pow(1-clamp(x),3);
// springy pop: overshoots a little and settles
const pop=x=>{x=clamp(x);if(x>=1)return 1;const c=1.70158*1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let D=null,SC=[],TOTAL=30,SFX=[];const INTRO=.8,TAIL=2.6,MIN=61.5;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>/^\d+$/.test(String(v))?` data-v="${v}"`:"";
const ARROW=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const STAR=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>`;
function fit(el,min){let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&fs>min){fs-=3;el.style.fontSize=fs+"px"}}
function shade(hex,f){const h=String(hex||"#71717a").replace("#","");if(h.length<6)return "#3f3f46";return "#"+[0,2,4].map(i=>Math.round(parseInt(h.slice(i,i+2),16)*(1-f)).toString(16).padStart(2,"0")).join("")}
const disc=(tm,c,cls="disc")=>`<div class="${cls}" style="background:radial-gradient(circle at 35% 28%,${c},${shade(c,.55)})">${esc(tm||"")}</div>`;
const shot=(p,tm,c)=>p?`<div class="ph"><img src="${esc(p)}" alt=""></div>`:`<div class="ph d">${disc(tm,c)}</div><div class="gs"></div>`;
const plain=h=>String(h||"").replace(/<[^>]+>/g,"");
function build(data){D=data;SC=[];SFX=[];
 document.getElementById("wm").textContent=D.brand;document.getElementById("dt").textContent=D.date;
 document.getElementById("src").textContent=(D.source||"")+(D.credits&&D.credits.length?" · Photos: Wikimedia Commons (see caption)":"");
 // with a voiceover each scene lasts as long as its line (data.dur, from tts.py) plus a beat; the line starts at va
 let h="",t=INTRO;const add=(id,dur,html,extra={})=>{const v=D.dur&&D.dur[id],off=id==="hook"?.1:.3;if(v!=null)dur=Math.max(2.4,v+off+.35);
  SC.push(Object.assign({id,t0:t,t1:t+dur,va:t+off},extra));t+=dur;h+=`<div class="sc ${extra.kind==="card"?"":"tall"}" id="${id}">${html}</div>`};
 const OUT=D.mode==="preview"?["Follow for","the morning","recap"]:["Follow for","tomorrow's","best stats"];
 if(D.mode==="preview"){const H=D.hook;
  add("hook",3.4,`<div class="hero"><div class="wmk">Tonight</div>
   <div class="htop"><div class="h2">${esc(D.title)}</div><div class="rank">${esc(H.sport||"Tonight")}<b>${esc(H.tm||"")}</b></div></div>
   <div class="shot"><div class="ph d">${disc(H.tm||"X",H.color)}</div><div class="gs"></div></div>
   <div class="spec"><div class="nm">${esc(H.who)}</div><div class="pr"><b>${esc(H.big)}</b><span>${esc(H.label)}</span></div><div class="s2">${esc(H.ctx)}</div></div>
   <div class="view">Games to watch ${ARROW}</div></div>`);
  D.games.forEach((g,i)=>add("g"+i,4,`<div class="hero"><div class="wmk">${esc(g.home.nick)}</div>
   <div class="htop"><div class="h2"><span class="fit">${g.away.rank?"#"+g.away.rank+" ":""}${esc(g.away.nick)}</span><span class="fit">@ ${g.home.rank?"#"+g.home.rank+" ":""}${esc(g.home.nick)}</span></div><div class="rank">${esc(g.sport)}<b>${esc(g.time)}</b></div></div>
   <div class="shot"><div class="ph d vs">${disc(g.away.ab,g.away.color)}<span class="at">@</span>${disc(g.home.ab,g.home.color)}</div></div>
   <div class="spec"><div class="nm">${esc(g.away.ab)} ${esc(g.away.rec)} · ${esc(g.home.ab)} ${esc(g.home.rec)}</div>${g.big?`<div class="pr"><b>${esc(g.big.v)}</b><span>${esc(g.big.lab)}</span></div>`:""}<div class="s2">${g.big?esc(g.big.who):""}${g.tv?(g.big?" · ":"")+esc(g.tv):""}</div></div>
   <div class="tags">${g.chips.map(c=>`<span class="tag" style="--c:var(--go)"><i></i>${esc(c)}</span>`).join("")}</div>
   <div class="view">${g.out.length?"Out: "+esc(g.out.join(", ")):esc(g.time+" ET"+(g.tv?" · "+g.tv:""))}</div></div>`,{kind:"game"}));
  const n=D.slate.length,c3=n>10;
  add("slate",Math.min(5,2.6+n*.15),`<div class="hero"><div class="wmk">Slate</div><div class="htop"><div><div class="k">Full slate</div><div class="h2" style="margin-top:10px">Tonight</div></div><div class="rank">${esc(D.date)}<b>${n}</b></div></div>
   <div class="grid ${c3?"c3":""}" style="grid-template-columns:repeat(${c3?3:2},1fr)">${D.slate.map(g=>`<div class="g"><div class="r w" style="--c:${g.ac}"><i></i><b>${esc(g.a)}</b></div><div class="r w" style="--c:${g.hc}"><i></i><b>${esc(g.h)}</b></div><em>${esc(g.t)} ET · ${esc(g.sport)}</em></div>`).join("")}</div></div>`,{kind:"scores"});
 }else{
 const H=D.hook,lab=String(H.label||"");
 add("hook",3.4,`<div class="hero"><div class="wmk">${esc(lab.split(" ").pop())}</div>
  <div class="htop"><div class="h2">${esc(D.title)}</div><div class="rank">${esc(H.sport||"")}<b>${esc(H.tm||"")}</b></div></div>
  <div class="shot">${shot(H.photo,H.tm,H.color)}</div>
  <div class="spec"><div class="nm">${esc(H.who)}</div><div class="pr"><b>${esc(H.big)}</b><span>${esc(lab)}</span></div><div class="s2">${H.ctx}</div></div>
  <div class="view">${D.sections.map(s=>`${esc(s.sport)} ${s.total}`).join(" · ")} finals ${ARROW}</div></div>`);
 D.sections.forEach((S,si)=>{const n=S.games.length,cols=n>10?3:n>1?2:1;
  add("s"+si,Math.min(5.2,2.4+n*.22),`<div class="hero"><div class="wmk">${esc(S.sport)}</div>
   <div class="htop"><div><div class="k">Final scores</div><div class="h2" style="margin-top:10px">${esc(S.sport)}</div></div><div class="rank">${esc(S.when||"")}<b>${S.total}</b></div></div>
   ${""}<div class="grid ${cols===3?"c3":""}" style="grid-template-columns:repeat(${cols},1fr)">${S.games.map(g=>`<div class="g">${[g.a,g.h].map(x=>`<div class="r ${x.w?"w":""}" style="--c:${x.w?"var(--go)":"var(--rim)"}"><i></i><b>${x.rk?`<u>${x.rk}</u>`:""}${esc(x.ab)}</b><s>${esc(x.s)}</s></div>`).join("")}${g.note?`<em>${esc(g.note)}</em>`:""}</div>`).join("")}</div>${S.note?`<div class="view note">${esc(S.note)}</div>`:""}</div>`,{kind:"scores"});
  S.top.forEach((p,i)=>{const id=`p${si}_${i}`,main=p.stats[0],rest=p.stats.slice(1);
   add(id,3.9,`<div class="hero"><div class="wmk">${esc(p.last)}</div>
    <div class="htop"><div class="h2"><span class="fit">${esc(p.first)}</span><span class="fit">${esc(p.last)}</span></div><div class="rank">${esc(S.sport)}<b>${esc(p.rank||({"Top passer":"PASS","Top rusher":"RUSH","Top receiver":"REC"})[p.tag]||"")}</b></div></div>
    <div class="shot">${shot(p.photo,p.tm,p.color)}${p.note?`<div class="stamp"><div>Season<br>best<small>${esc(p.note.replace(/ this season$/i,""))}</small></div></div>`:""}</div>
    <div class="spec"><div class="nm">${esc(p.tag)}</div><div class="pr"><b${num(main[0])}>${esc(main[0])}</b><span>${esc(main[1])}</span></div><div class="s2">${p.ctx}</div></div>
    <div class="tags">${rest.map(s=>`<span class="tag" style="--c:var(--go)"><i></i>${esc(s[0])} ${esc(s[1])}</span>`).join("")}${p.sub.slice(0,2).map(s=>`<span class="tag"><i></i>${esc(s)}</span>`).join("")}</div>
    <div class="view">${p.note?STAR+esc(p.note):esc(S.sport+" · "+p.tag)}</div></div>`,{kind:"card",si,i,note:!!p.note})})});
 if(D.more&&D.more.length)add("more",2.6+D.more.length*.6,`<div class="hero"><div class="wmk">More</div><div class="k">A few more big ones</div><div class="mlist">${D.more.map(r=>`<div class="mr">
   ${r.photo?`<div class="av" style="background:radial-gradient(circle at 35% 28%,${r.color},${shade(r.color,.55)})"><img src="${esc(r.photo)}" alt=""></div>`:disc(r.tm,r.color,"av")}
   <div style="min-width:0"><b class="fit">${esc(r.name)}</b><small><em>${esc(r.sport)}</em>${esc(r.tm)} · ${esc(r.txt)}</small></div></div>`).join("")}</div></div>`,{kind:"more"});
 }
 add("outro",3.4,`<div class="hero"><div class="wmk">${esc(D.brand)}</div><div class="k">Every morning</div>
  <div class="h2">${OUT.map(x=>`<span class="fit">${esc(x)}</span>`).join("")}</div>
  <div class="view" style="position:relative"><span id="fl">Follow ${esc(D.brand)}</span><div class="ring"></div></div></div>`,{kind:"outro"});
 // over a minute, every time (TikTok only pays on videos longer than 1:00): if it runs short, each screen holds a little longer
 const short=MIN-(t+TAIL);if(short>0){const mids=SC.filter(s=>s.id!=="hook"),per=short/mids.length;let sh=0;
  for(const s of SC){s.t0+=sh;s.va+=sh;if(s.id!=="hook")sh+=per;s.t1+=sh}t+=short}
 for(const s of SC)if(s.id!=="hook")SFX.push({t:s.t0,k:"whoosh"});
 document.getElementById("stage").innerHTML=h;TOTAL=t+TAIL;SFX.push({t:.42,k:"whoosh"},{t:t+.1,k:"sting"});
 document.querySelectorAll(".h2 .fit").forEach(e=>fit(e,48));document.querySelectorAll(".mr .fit").forEach(e=>fit(e,40));
 document.querySelectorAll(".spec .nm").forEach(e=>fit(e,24));
 document.querySelectorAll(".wmk").forEach(e=>{const w=e.parentElement.clientWidth*1.5;let fs=560;e.style.fontSize=fs+"px";while(e.scrollWidth>w&&fs>200){fs-=20;e.style.fontSize=fs+"px"}});
 // the card strip: the cards of whichever sport is on screen
 // pop-up sounds: the season-best stamp, and the tags on each card
 for(const s of SC){if(s.kind==="scores"&&document.querySelector("#"+s.id+" .view"))SFX.push({t:s.t0+1.1,k:"pop"});if(s.kind==="card"||s.kind==="game"){SFX.push({t:s.t0+.75,k:"pop"});if(s.note)SFX.push({t:s.t0+1.25,k:"stamp"})}if(s.kind==="outro")SFX.push({t:s.t0+1.2,k:"pop"})}
 return TOTAL}
function stripFor(si,i){const S=D.sections[si],el=document.getElementById("strip");const key=si+"_"+i;if(el.dataset.k===key)return;el.dataset.k=key;
 el.innerHTML=S.top.map((p,j)=>`<div class="c2 ${j===i?"on":""}"><div class="av" style="background:radial-gradient(circle at 35% 28%,${p.color},${shade(p.color,.55)})">${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(p.tm||"")}</div>
  <div style="min-width:0"><b>${esc(p.last)}</b><small>${esc(p.stats[0][0])} ${esc(p.stats[0][1])}</small></div></div>`).join("")}
function countUp(el,k){if(!el||el.dataset.v==null)return;const v=+el.dataset.v;if(!isNaN(v))el.textContent=Math.round(v*k)}
function render(t){const N=SC.length;let cur=0;
 for(let j=0;j<N;j++){const s=SC[j],el=document.getElementById(s.id),on=t>=s.t0-.01&&t<s.t1+.4;
  if(!on){el.style.opacity=0;continue}
  const lt=t-s.t0,a=s.id==="hook"?ease((lt+.08)/.3):ease(lt/.5),b=s.id==="outro"?ease((s.t1+.45-t)/.45):ease((s.t1-t+.4)/.4);
  if(t>=s.t0)cur=j;
  // swipe: in from the right, out to the left, like flicking through the card strip
  const x=(1-a)*260-(1-b)*260,sc=.94+.06*Math.min(a,b);
  el.style.opacity=Math.min(a,b).toFixed(3);el.style.transform=`translateX(${x.toFixed(1)}px) scale(${sc.toFixed(4)})`;el.style.zIndex=t>=s.t0?2:1;
  el.querySelectorAll(".ph img, .ph .disc").forEach((img,q)=>{const f=Math.sin((t+j+q*1.7)*1.4);img.style.transform=`translateY(${(f*12-(1-ease((lt-.1)/.6))*-80).toFixed(1)}px) rotate(${(s.kind==="card"||s.id==="hook"?-3+f*1.5:-6+f*2).toFixed(2)}deg) scale(${(.85+.15*ease((lt-.05)/.6)).toFixed(3)})`;
   const gs=el.querySelector(".gs");if(gs)gs.style.transform=`scale(${(1-.12*(f+1)/2).toFixed(3)})`})
  const w=el.querySelector(".wmk");if(w)w.style.transform=`translate(calc(-50% + ${((1-ease(lt/1.2))*120-lt*6).toFixed(1)}px),-50%)`;
  if(s.id==="hook"){const v=el.querySelector(".view"),y=pop((lt-.9)/.45);v.style.transform=`scale(${y.toFixed(3)})`;v.style.opacity=clamp((lt-.9)/.15)}
  if(s.kind==="scores"){const v=el.querySelector(".view");if(v){const y=pop((lt-1.1)/.45);v.style.opacity=clamp((lt-1.1)/.12).toFixed(3);v.style.transform=`scale(${(.7+.3*y).toFixed(3)})`}}
  if(s.kind==="scores")el.querySelectorAll(".g").forEach((g,i)=>{const y=pop((lt-.3-i*.06)/.42);g.style.opacity=clamp((lt-.3-i*.06)/.12).toFixed(3);g.style.transform=`scale(${(.6+.4*y).toFixed(3)})`});
  if(s.kind==="card"||s.kind==="game"){el.querySelectorAll(".h2 .fit").forEach((n,i)=>{const y=ease((lt-i*.08)/.5);n.style.transform=`translateX(${((1-y)*-90).toFixed(1)}px)`;n.style.opacity=y.toFixed(3)});
   countUp(el.querySelector(".pr b"),ease((lt-.2)/.9));
   el.querySelectorAll(".tag").forEach((g,i)=>{const y=pop((lt-.75-i*.09)/.4);g.style.opacity=clamp((lt-.75-i*.09)/.12).toFixed(3);g.style.transform=`scale(${(.5+.5*y).toFixed(3)})`});
   const st=el.querySelector(".stamp");if(st){const y=pop((lt-1.25)/.45);st.style.opacity=clamp((lt-1.25)/.08).toFixed(3);st.style.transform=`scale(${(2.2-1.2*y).toFixed(3)}) rotate(${(-28+18*y).toFixed(1)}deg)`}
   const v=el.querySelector(".view"),y=pop((lt-1.05)/.45);v.style.opacity=clamp((lt-1.05)/.12).toFixed(3);v.style.transform=`translateY(${((1-y)*40).toFixed(1)}px)`}
  if(s.kind==="more"){const cue=D.cues&&D.cues.more;el.querySelectorAll(".mr").forEach((r,i)=>{const at=cue&&cue[i+1]!=null?s.va-s.t0+cue[i+1]-.15:.3+i*.45,y=pop((lt-at)/.45);
    r.style.opacity=clamp((lt-at)/.12).toFixed(3);r.style.transform=`translateX(${((1-ease((lt-at)/.45))*-120).toFixed(1)}px) scale(${(.8+.2*y).toFixed(3)})`})}
  if(s.kind==="outro"){el.querySelectorAll(".h2 .fit").forEach((f,i)=>{const y=ease((lt-.1-i*.1)/.5);f.style.transform=`translateX(${((1-y)*-80).toFixed(1)}px)`;f.style.opacity=y.toFixed(3)});
   // the Follow button gets tapped: press, ring, and it flips to Following
   const v=el.querySelector(".view"),r=el.querySelector(".ring"),tp=lt-1.2;v.style.transform=`scale(${tp<0?pop((lt-.5)/.5):tp<.12?1-.06*(tp/.12):1-.06+.06*pop((tp-.12)/.4)})`;
   if(tp>0){const y=ease(tp/.7);r.style.opacity=(1-y).toFixed(3);r.style.transform=`scale(${(1+y*5).toFixed(3)})`}
   const fl=document.getElementById("fl");fl.textContent=tp>.12?"Following ✓":"Follow "+D.brand;v.style.background=tp>.12?"var(--go)":"var(--paper)"}}
 // the card strip shows on player cards; the dot walks along the bar through the video
 const c=SC[cur],strip=document.getElementById("strip");
 if(c&&c.kind==="card"){stripFor(c.si,c.i);const y=ease((t-c.t0)/.4);strip.style.opacity=SC[cur-1]&&SC[cur-1].kind==="card"?1:y;strip.style.transform=`translateY(${SC[cur-1]&&SC[cur-1].kind==="card"?0:((1-y)*60).toFixed(1)}px)`}
 else strip.style.opacity=0;
 document.getElementById("dot").style.left=(clamp(t/TOTAL)*100).toFixed(2)+"%";
 // intro: the X holds, then the camera flies through it into the first card. Outro: everything fades back to the X, the same frame the video starts on.
 let lo=0,ls=1;if(t<INTRO+.1){if(t<.42){lo=1;ls=1+.025*Math.sin(t*9)}else{const x=ease((t-.42)/.4);ls=1+x*7;lo=1-x}}
 // the signature end card: the X slams in, the dot pops, CROSSOVER spreads out under it, then it settles on the X alone (the first frame)
 const end=TOTAL-TAIL;let sg=0,dp=1;
 if(t>end+.1){const k=t-end-.1;lo=clamp(k/.1);ls=1+.55*(1-pop(k/.42));dp=pop((k-.3)/.35);
  sg=Math.min(ease((k-.45)/.35),ease((TOTAL-.08-t)/.5))}
 const SG=document.getElementById("sig");SG.style.opacity=sg.toFixed(3);SG.querySelector("b").style.letterSpacing=`${(.08+.1*(1-ease((t-end-.55)/.6))).toFixed(3)}em`;
 document.querySelector("#logo i").style.transform=`scale(${Math.max(0,dp).toFixed(3)})`;
 const L=document.getElementById("logo");L.style.opacity=lo.toFixed(3);L.style.transform=`translate(-50%,-50%) scale(${ls.toFixed(3)})`;
 for(const q of [".top",".nav","#src"])document.querySelector(q).style.opacity=(1-lo).toFixed(3)}
// fonts load only when first used, so load them before build() measures any text
window.ready=()=>Promise.all(['500 100px "Archivo"','800 100px "Archivo"','900 100px "Big Shoulders"'].map(f=>document.fonts.load(f)));
window.build=build;window.render=render;
</script></body></html>
