<!doctype html>
<html><head><meta charset="utf-8"><title>Crossover stats video</title>
<style>
@font-face{font-family:"Archivo";src:url(../fonts/archivo-x.woff) format("woff");font-weight:400 900;font-stretch:62% 125%}
@font-face{font-family:"Big Shoulders";src:url(../fonts/big-shoulders.woff) format("woff");font-weight:700 900}
/* CROSSOVER broadcast look: every screen takes the team's colour full-bleed, halftone and speed stripes on top,
   giant extruded numbers, a volt-yellow accent, and an X-shaped diagonal wipe between screens. */
:root{--volt:#D7FF3A;--ink:#fff;--night:#09090B;--tc:#1d4ed8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--night)}
body{font-family:"Archivo",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.big,.nm,.g .s,.ab{font-family:"Big Shoulders",sans-serif;font-weight:900;text-transform:uppercase}
.sc{position:absolute;inset:0;opacity:0;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 85%,#fff) 0%,var(--tc) 38%,color-mix(in srgb,var(--tc) 45%,#000) 100%)}
.sc::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle,rgba(0,0,0,.28) 1.6px,transparent 2px) 0 0/18px 18px;transform:rotate(18deg);opacity:.55}
.sc .stripes{position:absolute;left:-30%;right:-30%;top:-10%;height:120%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 26px,transparent 26px 120px)}
.sc .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 62%,rgba(0,0,0,.72) 100%)}
.in{position:absolute;left:70px;right:150px;top:250px;bottom:400px}
.tag{display:inline-block;background:var(--volt);color:#000;font:900 34px/1 "Archivo";font-stretch:118%;letter-spacing:.06em;text-transform:uppercase;padding:14px 22px 13px;transform:skewX(-12deg)}
.tag>span{display:inline-block;transform:skewX(12deg)}
.tag.w{background:#fff}.tag.k{background:#000;color:#fff}
.big{display:inline-block;font-size:520px;line-height:.78;letter-spacing:-.01em;color:#fff;white-space:nowrap;text-shadow:6px 6px 0 rgba(0,0,0,.35),12px 12px 0 rgba(0,0,0,.25),18px 18px 0 rgba(0,0,0,.18)}
.nm{line-height:.84;color:#fff}
.nm small{display:block;font:800 46px/1 "Archivo";font-stretch:115%;letter-spacing:.08em;color:rgba(255,255,255,.85);margin-bottom:10px}
.nm b{display:block;font-size:168px;white-space:nowrap;text-shadow:5px 5px 0 rgba(0,0,0,.3)}
.bar{display:inline-flex;align-items:center;background:#000;color:#fff;font:700 31px/1 "Archivo";padding:16px 24px;transform:skewX(-12deg)}
.bar>span{transform:skewX(12deg);display:inline-block}
.bar b{color:var(--volt)}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{background:rgba(0,0,0,.55);border:3px solid #fff;padding:14px 18px 12px;min-width:150px}
.chip b{display:block;font:900 64px/.9 "Big Shoulders"}
.chip span{display:block;font:800 19px/1 "Archivo";letter-spacing:.12em;text-transform:uppercase;margin-top:6px;color:rgba(255,255,255,.85)}
.viz{background:rgba(0,0,0,.6);border:4px solid #fff;padding:12px;height:400px;display:flex;align-items:center;justify-content:center}
.viz svg{width:100%;height:100%}
.rank{position:absolute;right:0;top:0;width:190px;height:190px;border-radius:50%;background:var(--volt);color:#000;display:grid;place-items:center;font:900 120px/1 "Big Shoulders";box-shadow:0 18px 40px rgba(0,0,0,.35)}
.stamp{position:absolute;right:-10px;top:330px;background:#fff;color:#000;font:900 40px/.95 "Big Shoulders";text-transform:uppercase;padding:16px 20px;transform:rotate(-8deg);box-shadow:8px 8px 0 var(--volt);text-align:center}
.stamp small{display:block;font:800 17px/1.1 "Archivo";letter-spacing:.1em;margin-top:6px}
.rows{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.rows.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g{background:#000;transform:skewX(-8deg);overflow:hidden}
.g>div{transform:skewX(8deg);display:flex;flex-direction:column}
.g .r{display:flex;align-items:center;height:62px}
.g .r i{width:16px;align-self:stretch;flex:none}
.g .ab{font-size:50px;padding:0 16px;color:#777;flex:1;white-space:nowrap}
.g .s{font-size:54px;padding:0 18px;color:#777;text-align:right}
.g .r.w .ab{color:#fff}.g .r.w .s{color:var(--volt)}
.g em{display:block;font:800 17px/1 "Archivo";font-style:normal;letter-spacing:.12em;color:var(--volt);padding:0 0 8px 34px}
.rows.two .g .ab{font-size:42px}.rows.two .g .s{font-size:46px}.rows.two .g .r{height:54px}
.note{margin-top:24px;background:#fff;color:#000;font:800 30px/1.2 "Archivo";padding:18px 22px;transform:skewX(-8deg)}
.note>span{display:block;transform:skewX(8deg)}
.vs{position:absolute;inset:0}
.vs .a,.vs .h{position:absolute;inset:0}
.vs .a{clip-path:polygon(0 0,100% 0,100% 38%,0 62%);background:linear-gradient(160deg,var(--ac),color-mix(in srgb,var(--ac) 45%,#000))}
.vs .h{clip-path:polygon(0 62%,100% 38%,100% 100%,0 100%);background:linear-gradient(200deg,var(--hc),color-mix(in srgb,var(--hc) 45%,#000))}
.vs .seam{position:absolute;left:-10%;right:-10%;top:50%;height:16px;margin-top:-8px;background:var(--volt);transform:rotate(-12.5deg);box-shadow:0 0 30px rgba(215,255,58,.6)}
.tm{position:absolute;left:70px;right:150px;text-transform:uppercase}
.tm .ab{font-size:260px;line-height:.8;text-shadow:8px 8px 0 rgba(0,0,0,.3);color:#fff}
.tm .rc{font:800 40px/1 "Archivo";letter-spacing:.06em;margin-top:8px}
.vsx{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:#000;border:6px solid var(--volt);display:grid;place-items:center;font:900 70px/1 "Big Shoulders";color:var(--volt)}
.ml{display:flex;flex-direction:column;gap:16px;margin-top:30px}
.mr{display:grid;grid-template-columns:24px 1fr;background:#000;transform:skewX(-8deg)}
.mr>div{transform:skewX(8deg);padding:16px 22px;min-width:0}
.mr b{display:block;font:900 66px/.9 "Big Shoulders";text-transform:uppercase;white-space:nowrap}
.mr span{display:block;font:700 28px/1.2 "Archivo";color:#ddd;margin-top:8px}
#bug{position:absolute;left:70px;right:70px;top:110px;display:flex;justify-content:space-between;align-items:center;z-index:5}
#bug .wm{background:#fff;color:#000;font:900 44px/1 "Big Shoulders";letter-spacing:.06em;padding:10px 18px 8px;transform:skewX(-12deg)}
#bug .wm span{display:inline-block;transform:skewX(12deg)}
#bug .dt{background:#000;color:var(--volt);font:800 24px/1 "Archivo";font-stretch:115%;letter-spacing:.12em;text-transform:uppercase;padding:13px 18px;transform:skewX(-12deg)}
#segs{position:absolute;left:70px;right:70px;top:184px;display:flex;gap:6px;z-index:5}
#segs i{flex:1;height:6px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
#segs i b{position:absolute;left:0;top:0;bottom:0;background:#fff}
#wipe{position:absolute;inset:0;z-index:7;pointer-events:none}
#wipe i{position:absolute;left:-60%;width:220%;height:700px;top:50%;margin-top:-350px;opacity:0}
#wipe .a{background:var(--volt)}#wipe .b{background:#fff}
#logo{position:absolute;inset:0;z-index:8;background:var(--night);opacity:0;overflow:hidden}
#logo .s1,#logo .s2{position:absolute;left:50%;top:44%;width:3000px;height:150px;margin:-75px 0 0 -1500px}
#logo .s1{background:var(--volt)}#logo .s2{background:#fff}
#logo .wd{position:absolute;left:0;right:0;top:calc(44% + 470px);text-align:center;font:900 130px/1 "Big Shoulders";letter-spacing:.1em;color:#fff}
#logo .wd small{display:block;font:800 30px/1 "Archivo";font-stretch:118%;letter-spacing:.22em;color:var(--volt);margin-top:20px}
/* the ending card: follow for more (the narrator says it too). Volt full-bleed, black type, a follow button that gets tapped */
.fo{margin-top:46px;font:900 290px/.8 "Big Shoulders";color:#000;text-transform:uppercase}
.fo span{display:block;white-space:nowrap;transform-origin:0 80%}.fo span.w{color:#fff;text-shadow:12px 12px 0 #000;font-size:220px;margin-top:18px}
.fbtn{position:relative;display:inline-flex;align-items:center;gap:22px;margin-top:70px;background:#000;color:#fff;font:900 64px/1 "Archivo";font-stretch:112%;letter-spacing:.04em;text-transform:uppercase;padding:30px 46px 28px 34px;border-radius:999px;box-shadow:0 22px 40px rgba(0,0,0,.35)}
.fbtn i{width:64px;height:64px;border-radius:50%;background:var(--volt);display:grid;place-items:center}.fbtn i svg{width:38px;height:38px}
.fbtn .b{display:none}.fbtn.on{background:#fff;color:#000}.fbtn.on i{background:#000;color:var(--volt)}.fbtn.on .a{display:none}.fbtn.on .b{display:inline}
.tap{position:absolute;right:-20px;bottom:-30px;width:110px;height:110px;border-radius:50%;border:8px solid #fff;opacity:0}
#src{position:absolute;left:70px;bottom:150px;font:600 21px/1 "Archivo";color:rgba(255,255,255,.55);z-index:5}
/* cover image: a sports poster. Team colour full-bleed, the brand X crossing behind a giant hard-shadowed number,
   black-and-volt bars, the stat graphic in a volt-edged panel. Nothing centred, no banner, no glow. */
#thumb{position:absolute;inset:0;display:none;z-index:30;overflow:hidden}
#thumb .xb{position:absolute;left:50%;width:3600px;height:250px;margin:-125px 0 0 -1800px}
#thumb .xb.a{background:var(--volt);transform:rotate(-38deg)}
#thumb .xb.b{background:#000;transform:rotate(38deg)}
#thumb .top{position:absolute;left:60px;right:60px;top:92px;display:flex;justify-content:space-between;align-items:center;z-index:2}
#thumb .wm{background:#fff;color:#000;font:900 62px/1 "Big Shoulders";letter-spacing:.06em;padding:12px 22px 9px;transform:skewX(-12deg)}
#thumb .wm span,#thumb .cl span{display:inline-block;transform:skewX(12deg)}
#thumb .when{background:#000;color:var(--volt);font:900 32px/1 "Archivo";font-stretch:118%;letter-spacing:.12em;text-transform:uppercase;padding:17px 22px;transform:skewX(-12deg)}
#thumb .cv{position:absolute;left:60px;right:60px;top:210px;bottom:120px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;z-index:2}
#thumb .cn{font:900 900px/.76 "Big Shoulders";color:#fff;white-space:nowrap;letter-spacing:-.01em;text-shadow:18px 18px 0 #000;padding-right:18px}
#thumb .cl{margin-top:48px;background:#000;color:var(--volt);font:900 96px/1 "Big Shoulders";letter-spacing:.05em;text-transform:uppercase;padding:14px 30px 8px;transform:skewX(-12deg);white-space:nowrap}
#thumb .fn{margin-top:40px;font:900 56px/1 "Archivo";font-stretch:118%;letter-spacing:.1em;color:#fff;text-transform:uppercase;background:#000;padding:10px 16px 8px}
#thumb .ln{font:900 280px/.82 "Big Shoulders";color:#fff;text-transform:uppercase;white-space:nowrap;text-shadow:12px 12px 0 #000;max-width:100%;overflow:hidden;padding:0 14px 14px 0;margin-top:8px}
#thumb .cx{margin-top:22px}#thumb .cx.bar{font-size:36px;padding:18px 26px}
#thumb .hd{display:flex;align-items:center;justify-content:space-between;align-self:stretch;gap:20px}
#thumb .ct{flex:none;width:400px;background:#000;padding:16px 12px 10px;transform:rotate(4deg);box-shadow:16px 16px 0 var(--volt);margin-right:12px}
#thumb .ct svg{display:block;width:100%;height:auto}
</style></head><body>
<div id="stage"></div>
<div id="bug"><div class="wm"><span>CROSSOVER</span></div><div class="dt" id="dt"></div></div>
<div id="segs"></div>
<div id="src"></div>
<div id="wipe"><i class="a"></i><i class="b"></i></div>
<div id="logo"><i class="s1"></i><i class="s2"></i><div class="wd">CROSSOVER<small id="lgs">Best stats · every day</small></div></div>
<div id="thumb"></div>
<script src="viz.js"></script>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>1-Math.pow(1-clamp(x),3),eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pop=x=>{x=clamp(x);if(x>=1)return 1;const c=1.70158*1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let D=null,SC=[],TOTAL=30,SFX=[];const INTRO=.75,TAIL=2.6,MIN=61.5;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fit(el,min){let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&fs>min){fs-=4;el.style.fontSize=fs+"px"}}
const tag=(t,c="")=>`<div class="tag ${c}"><span>${t}</span></div>`;
const viz=(v,tm)=>v?`<div class="viz">${VIZ.html(v,"#D7FF3A",tm)}</div>`:"";
const bg=()=>`<div class="stripes"></div><div class="shade"></div>`;
const SPORTC={NBA:"#c2410c",NFL:"#065f46",CFB:"#7c2d12"};
function build(data){D=data;SC=[];SFX=[];
 document.getElementById("dt").textContent=(D.mode==="preview"?"Tonight · ":"")+D.date;document.getElementById("src").textContent=D.source||"";
 document.getElementById("lgs").textContent=D.mode==="preview"?"Tonight's games · every day":"Best stats · every day";
 let h="",t=INTRO;const add=(id,dur,tc,html,extra={})=>{const v=D.dur&&D.dur[id],off=id==="hook"?.1:.3;if(v!=null)dur=Math.max(2.4,v+off+.35);
  SC.push(Object.assign({id,t0:t,t1:t+dur,va:t+off},extra));t+=dur;h+=`<div class="sc" id="${id}" style="--tc:${tc||"#1d4ed8"}">${bg()}${html}</div>`};
 const hook=(H,lab)=>`<div class="in">${tag(esc(lab))}<div style="margin-top:70px"><div class="big">${esc(H.big)}</div></div><div style="margin-top:30px">${tag(esc(H.label),"w")}</div>
   <div class="nm" style="margin-top:50px"><b>${esc(H.who)}</b></div><div style="margin-top:36px"><div class="bar"><span>${H.ctx||""}</span></div></div></div>`;
 if(D.mode==="preview"){const H=D.hook;
  add("hook",3.4,H.bg||H.color,hook(H,(H.sport||"")+" · Tonight"),{kind:"hook"});
  D.games.forEach((g,i)=>add("g"+i,4,g.home.bg||g.home.color,`<div class="vs" style="--ac:${g.away.bg||g.away.color};--hc:${g.home.bg||g.home.color}"><div class="a"></div><div class="h"></div><div class="seam"></div></div>
   <div class="tm" style="top:250px"><div class="ab">${g.away.rank?"#"+g.away.rank+" ":""}${esc(g.away.ab)}</div><div class="rc">${esc(g.away.nick)} · ${esc(g.away.rec||"")}</div></div>
   <div class="vsx">@</div>
   <div class="tm" style="top:1010px;text-align:right"><div class="ab">${g.home.rank?"#"+g.home.rank+" ":""}${esc(g.home.ab)}</div><div class="rc">${esc(g.home.nick)} · ${esc(g.home.rec||"")}</div></div>
   <div class="tm" style="top:1330px">${tag(esc(g.sport+" · "+g.time+" ET"+(g.tv?" · "+g.tv:"")))}${g.big?`<div style="margin-top:18px"><div class="bar"><span><b>${esc(g.big.v)}</b> ${esc(g.big.lab)} · ${esc(g.big.who)}</span></div></div>`:""}</div>`,{kind:"game"}));
  const n=D.slate.length,two=n>7;
  add("slate",Math.min(5,2.6+n*.15),"#18181b",`<div class="in">${tag("Full slate · "+n+" games")}<div style="margin-top:30px"><div class="big" style="font-size:200px">Tonight</div></div>
   <div class="rows ${two?"two":""}">${D.slate.map(g=>`<div class="g"><div>${[[g.a,g.ac],[g.h,g.hc]].map(([ab,c])=>`<div class="r w"><i style="background:${c}"></i><span class="ab">${esc(ab)}</span></div>`).join("")}<em>${esc(g.t)} ET · ${esc(g.sport)}</em></div></div>`).join("")}</div></div>`,{kind:"scores"});
 }else{
  const H=D.hook;
  add("hook",3.4,H.bg||H.color,hook(H,(H.sport||"")+" · "+(H.tm||"")),{kind:"hook"});
  D.sections.forEach((S,si)=>{const n=S.games.length,two=n>7;
   add("s"+si,Math.min(5.2,2.4+n*.22),SPORTC[S.sport]||"#18181b",`<div class="in">${tag(esc(S.sport)+" · Final scores")}<div style="margin-top:26px"><div class="big" style="font-size:210px">${S.total} final${S.total===1?"":"s"}</div></div>
    <div class="rows ${two?"two":""}">${S.games.map(g=>`<div class="g"><div>${[g.a,g.h].map(x=>`<div class="r ${x.w?"w":""}"><i style="background:${x.c}"></i><span class="ab">${x.rk?"#"+x.rk+" ":""}${esc(x.ab)}</span><span class="s">${esc(x.s)}</span></div>`).join("")}${g.note?`<em>${esc(g.note)}</em>`:""}</div></div>`).join("")}</div>
    ${S.note?`<div class="note"><span>${esc(S.note)}</span></div>`:""}</div>`,{kind:"scores"});
   S.top.forEach((p,i)=>{const id=`p${si}_${i}`,main=p.stats[0],rest=p.stats.slice(1);
    add(id,3.9,p.bg||p.color,`<div class="in">${tag(esc(S.sport)+" · "+esc(p.tag))}${p.rank?`<div class="rank">${esc(p.rank)}</div>`:""}
     <div style="display:flex;align-items:flex-end;gap:26px;margin-top:40px"><div class="big" data-v="${esc(main[0])}" style="font-size:330px">${esc(main[0])}</div><div style="padding-bottom:30px">${tag(esc(main[1]),"w")}</div></div>
     <div class="nm" style="margin-top:26px"><small>${esc(p.first)}</small><b>${esc(p.last)}</b></div>
     ${p.note?`<div class="stamp">Season best<small>${esc(p.note.replace(/ this season$/i,""))}</small></div>`:""}
     <div style="margin-top:28px">${viz(p.viz,p.tm)}</div>
     <div class="chips" style="margin-top:20px">${rest.map(s=>`<div class="chip"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}${p.sub.slice(0,1).map(s=>`<div class="chip"><b>${esc(s.split(" ")[0])}</b><span>${esc(s.split(" ").slice(1).join(" "))}</span></div>`).join("")}</div>
     <div style="margin-top:22px"><div class="bar"><span>${p.ctx}</span></div></div></div>`,{kind:"card",si,i,note:!!p.note,sport:S.sport})})});
  if(D.more&&D.more.length)add("more",2.6+D.more.length*.6,"#18181b",`<div class="in">${tag("More big games")}<div class="ml">${D.more.map(r=>`<div class="mr"><i style="background:${r.color}"></i><div><b>${esc(r.name)}</b><span>${esc(r.sport)} · ${esc(r.tm)} · ${esc(r.txt)}</span></div></div>`).join("")}</div></div>`,{kind:"more"});
 }
 // the ending: follow for more
 {const pv=D.mode==="preview";add("outro",3.6,"#D7FF3A",`<div class="in" style="top:500px">${tag(pv?"Enjoy the games":"That's the recap","k")}
  <div class="fo"><span>Follow</span><span class="w">for more</span></div>
  <div style="margin-top:44px"><div class="bar"><span>${pv?"<b>The morning recap</b> · every day":"<b>The best stats</b> · every morning"}</span></div></div>
  <div class="fbtn"><i><svg class="a" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#000" stroke-width="4" stroke-linecap="round"/></svg><svg class="b" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#D7FF3A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span class="a">Follow</span><span class="b">Following</span><b class="tap"></b></div></div>`,{kind:"outro"})}
 // over a minute every time (TikTok only pays on videos longer than 1:00); the ending card stays short
 const short=(D.min??MIN)-(t+TAIL);if(short>0){const grow=s=>s.id!=="hook"&&s.id!=="outro",mids=SC.filter(grow),per=short/mids.length;let sh=0;for(const s of SC){s.t0+=sh;s.va+=sh;if(grow(s))sh+=per;s.t1+=sh}t+=short}
 document.getElementById("stage").innerHTML=h;TOTAL=t+TAIL;
 document.getElementById("segs").innerHTML=SC.map(()=>`<i><b></b></i>`).join("");
 document.querySelectorAll(".nm b,.mr b").forEach(e=>fit(e,60));
 document.querySelectorAll(".big").forEach(e=>{const w=(e.closest(".in")||document.body).clientWidth-(e.dataset.v!=null?300:0);let fs=parseFloat(getComputedStyle(e).fontSize);while(e.getBoundingClientRect().width>w&&fs>120){fs-=10;e.style.fontSize=fs+"px"}});
 document.querySelectorAll(".tm .ab").forEach(e=>{let fs=260;while(e.scrollWidth>860&&fs>120){fs-=10;e.style.fontSize=fs+"px"}});
 // sound: a whoosh on every wipe, an impact on the big numbers, a tick per score, a swish for NBA cards, the stamp, a riser into each section
 SFX.push({t:.05,k:"impact"},{t:INTRO-.35,k:"whoosh"});
 for(const s of SC){if(s.id!=="hook")SFX.push({t:Math.max(.05,s.t0-.2),k:"whoosh"});
  if(s.kind==="hook"||s.kind==="card")SFX.push({t:s.t0+.3,k:"impact"});
  if(s.kind==="scores"){SFX.push({t:Math.max(.05,s.t0-.8),k:"riser"});document.querySelectorAll("#"+s.id+" .g").forEach((g,i)=>{if(i<14)SFX.push({t:s.t0+.35+i*.07,k:"tick"})})}
  if(s.kind==="card"){SFX.push({t:s.t0+1.2,k:"pop"});if(s.note)SFX.push({t:s.t0+1.5,k:"stamp"});if(s.sport==="NBA")SFX.push({t:s.t0+.15,k:"swish"})}
